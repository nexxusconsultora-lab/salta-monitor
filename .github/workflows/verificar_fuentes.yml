name: Verificar fuentes candidatas

# Mira en Google News si los medios de data/fuentes_candidatas.json publican (últimos 7 días) y guarda
# el resultado en data/fuentes_candidatas_status.json. No cambia el monitor. Se corre a mano.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: verificar-fuentes
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # No hay "pip install": el script usa solo lo que trae Python.
      - name: Verificar los medios candidatos
        run: python scripts/verificar_fuentes.py

      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/fuentes_candidatas_status.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Verificación de fuentes candidatas"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          exit 1
