name: Fuentes oficiales - Salta y Nación

on:
  # Corre solo cuando cambia el script o la lista de fuentes (por ejemplo
  # la primera vez que lo subís), así el panel tiene datos sin esperar.
  # No incluye data/oficiales.json a propósito: así el commit de datos
  # no vuelve a disparar este workflow en bucle.
  push:
    branches: [main]
    paths:
      - "scripts/oficiales.py"
      - "data/fuentes_oficiales.json"
      - ".github/workflows/oficiales.yml"
  schedule:
    # Los boletines oficiales salen una vez por día, no hace falta mirar
    # cada 5 minutos. GitHub usa hora UTC (Argentina = UTC-3):
    #   10:15 UTC = 07:15 hs | 14:15 UTC = 11:15 hs | 20:15 UTC = 17:15 hs
       - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Grupo propio (distinto del monitor de medios) para que las corridas
# de cada uno no se cancelen entre sí.
concurrency:
  group: oficiales-salta
  cancel-in-progress: false

jobs:
  oficiales:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No hay "pip install": el script usa solo lo que trae Python.
      - name: Ejecutar el recolector de fuentes oficiales
        run: python scripts/oficiales.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/oficiales.json data/oficiales_status.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de fuentes oficiales"
          # El monitor de medios también guarda en este repositorio:
          # si justo hubo otro cambio, reintentamos hasta 3 veces.
          for intento in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Reintentando ($intento/3)..."
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
