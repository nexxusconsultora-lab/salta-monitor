/* Vigencia = f(período registrado, tipo de fuente, fecha de HOY). Nunca se lee de un campo escrito a mano. */
function vigDe(p,hoy){
 const R=((S.res||{}).periodos||{})[p.id];
 if(R&&typeof R.vigente==='boolean')return{v:R.vigente?1:0,sinConf:false,txt:'Confirmado por una persona'+(R.fuente?' ('+R.fuente+')':'')};
 /* Nómina oficial: el recolector (scripts/nomina.py) lee el sitio oficial y deja vigencia + verificado_en. Se usa solo si la fila trae fecha de verificación; "vigente" además exige fuente oficial. */

 if(vf&&p.vigencia==='ex'){const xd=p.ex_desde?fdate(p.ex_desde,{dateStyle:'medium'}):'';return{v:0,sinConf:false,txt:'Ya no figura en la nómina oficial'+(xd?' (el recolector lo detectó el '+xd+')':'')+'; verificado el '+vf}}

function mkCargo(p,hoy){

const STOP=new Set(('para con por una uno unos unas del los las que como mas pero sus fue son era ser han hay este esta estos estas ese esa esos esas sobre entre desde hasta tras ante bajo cada todo toda todos todas otro otra otros otras muy sin segun tambien donde cuando quien quienes cual cuales tiene tienen tener hace hacer hizo dijo dice dicen dio dar quedo quedan sera seran sido estan estar estaba nuevo nueva nuevos nuevas primer primera primero anos dias hoy ayer manana semana mes meses vez veces gran ademas aunque luego ahora aqui alli asi puede pueden podria podran debe deben dos tres cuatro cinco seis siete ocho nueve diez mil millones video fotos foto vivo salta provincia provincial senado senador senadores senadora diputado diputados diputada camara concejal concejales legislatura gobernador politica noticia noticias enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre contra nacional provincial provinciales pueblo capital buscan pidio aprobo abandona').split(' '));

 const sel=`<div class="ctl"><select aria-label="Cámara" onchange="HEM.hl='';hemCfg('cam',this.value)">${VER_CAMS.map(([k,v])=>`<option value="${esc(k)}"${HEM.cam===k?' selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
 if(!N)return`<h2 class="sec">Hemiciclo</h2>${sel}<p class="empty">No hay integrantes vigentes cargados para esta cámara.</p>`;
 const col={},names=g.map(x=>x.b).slice().sort((a,b)=>a.localeCompare(b,'es'));names.forEach((b,i)=>{col[b]=b==='Sin dato de bloque'?'#5F6B7C':'hsl('+Math.round((i*137.508)%360)+',52%,40%)'});
 const L=hemAsientos(N),W=720,cx=W/2,cy=396,Rp=330,gap=L.R>1?(0.6*Rp)/(L.R-1):Rp*0.5,sp=Math.min(...L.n.map((k,i)=>k>1?Math.PI*L.rs[i]*Rp/(k-1):1e9)),rad=Math.max(5,Math.min(17,0.44*Math.min(gap,sp)));

/* ===== Verificador de composición legislativa ===== */
const VER_CAMS=[['Diputados','Diputados provinciales'],['Senado','Senado provincial'],['Concejo Deliberante','Concejo Deliberante de la Ciudad de Salta'],['Diputados de la Nación','Diputados nacionales por Salta'],['Senado de la Nación','Senadores nacionales por Salta']];

const verGrupos=cam=>{const g={};personas.forEach(p=>{const c=p.cargos.find(x=>x.v===1&&x.p.chamber===cam);if(!c)return;const b=c.bloque||'Sin dato de bloque';(g[b]=g[b]||[]).push(p)});return Object.entries(g).map(([b,m])=>({b,m,w:m.length})).sort((a,c)=>c.w-a.w||a.b.localeCompare(c.b,'es'))};

const verBloque=(t,g)=>{let best=null;g.forEach(x=>{if(x.b==='Sin dato de bloque')return;const fb=fold(x.b),a=verSigla(x.b);let s=0;if(t.includes(fb))s=fb.length+10;else if(a.length>=3&&new RegExp('(^|[^a-z0-9])'+a+'([^a-z0-9]|$)').test(t))s=a.length+5;if(s&&(!best||s>best.s))best={b:x.b,s}});return best&&best.b};
const VN_U={dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90},VN_D=['treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const verNum=t=>t.replace(new RegExp('\\b('+VN_D.join('|')+')\\s+y\\s+(un|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)\\b','g'),(m,d,u)=>VN_U[d]+({un:1,uno:1}[u]||VN_U[u])).replace(new RegExp('\\b('+Object.keys(VN_U).join('|')+')\\b(?!\\s+tercios)','g'),m=>VN_U[m]);
const verComp=q=>{const t=verNum(fold(q).replace(/\s+/g,' ').trim()),nv=(h,d,extra)=>Object.assign({v:'nv',h,d},extra||{});
 if(t.length<8)return nv('Escribí una afirmación completa','Por ejemplo: «Todos Por Salta tiene mayoría propia en Diputados provinciales».');

 const asum=cam!=='Concejo Deliberante'&&!/provincial|nacional|de la nacion|de la provincia/.test(t),g=verGrupos(cam),N=g.reduce((a,x)=>a+x.w,0);
 if(!N)return nv('No hay datos de ese cuerpo en la nómina','',{cam});
 const sd=(g.find(x=>x.b==='Sin dato de bloque')||{w:0}).w,real=g.filter(x=>x.b!=='Sin dato de bloque'),bl=verBloque(t,g),gb=bl?g.find(x=>x.b===bl):null;
 const pm=t.match(/(\d+(?:[.,]\d+)?)\s*(%|por ciento)/),nm=t.replace(/(\d+(?:[.,]\d+)?)\s*(%|por ciento)/g,'').match(/(^|[^\d.,])(\d{1,3})(?![\d])/),num=nm?+nm[2]:null;
 const neg=/\b(no|nunca)\s+(tiene|tienen|alcanza|alcanzan|posee|cuenta|logra|es)\b|sin mayoria|carece/.test(t),mayo=/mayoria|dos tercios/.test(t),grande=/mas grande|mayoritari|primera minoria|bloque principal|mayor cantidad|el mas numeroso|mas numeroso/.test(t);
 const base={cam,g,bl,asum,N,sd},yes=ok=>ok?'v':'f';
 if(bl&&grande&&!mayo){const top=real[0],emp=real.length>1&&real[1].w===top.w,es=top.b===bl&&!emp;

  const ok=neg?!es:es;return Object.assign({v:yes(ok),h:es?'«'+bl+'» es el bloque con más integrantes':'«'+bl+'» no es el bloque con más integrantes',d:es?bl+' tiene '+gb.w+' de '+N+'; le sigue '+(real[1]?real[1].b+' con '+real[1].w:'ninguno')+'.':'El bloque con más integrantes es «'+top.b+'» ('+top.w+' de '+N+'); «'+bl+'» tiene '+(gb?gb.w:0)+'.'},base)}

  if(!tiene&&!neg&&w+sd>=need)return nv('No se puede confirmar todavía','«'+bl+'» tiene '+w+' de '+N+' ('+lab+': '+need+'), pero '+sd+' integrante'+(sd>1?'s':'')+' no tiene'+(sd>1?'n':'')+' bloque cargado. Con esos datos faltantes podría llegar a esa cifra.',base);
  const ok=neg?!tiene:tiene;return Object.assign({v:yes(ok),h:tiene?'«'+bl+'» alcanza '+lab:'«'+bl+'» no alcanza '+lab,d:'«'+bl+'» tiene '+w+' de '+N+' integrantes; para '+lab+' hacen falta '+need+'.'},base)}

 return nv('Esta afirmación no se puede verificar con esta herramienta','Verifica composición: cuántos integrantes tiene un bloque, si alcanza la mayoría o los dos tercios, cuál es el bloque más numeroso y cuántos miembros tiene un cuerpo. No juzga votos, dichos ni hechos que no estén en la nómina.',Object.assign({},base));
};
let VER={q:'',r:null};window.verGo=q=>{VER.q=String(q||'');VER.r=verComp(VER.q);route()};

V.verificar=()=>{const gd=verGrupos('Diputados').filter(x=>x.b!=='Sin dato de bloque'),gs=verGrupos('Senado').filter(x=>x.b!=='Sin dato de bloque'),ex=[];
 if(gd[0]){ex.push(gd[0].b+' tiene '+gd[0].w+' diputados provinciales');ex.push(gd[0].b+' tiene '+(gd[0].w+4)+' diputados provinciales')}
 if(gs[0])ex.push(gs[0].b+' tiene mayoría propia en el Senado provincial');if(gd[1])ex.push(gd[1].b+' es el bloque más grande de Diputados provinciales');
 let res='';const r=VER.r;
 if(r){const L={v:'Verdadero',f:'Falso',nv:'No se puede verificar'},fec=r.cam?personas.flatMap(p=>p.cargos.filter(c=>c.p.chamber===r.cam&&c.v===1).map(c=>c.p.verificado_en||'')).sort().pop():'';
  res=`<div class="vd-card vd-${r.v}" role="status"><span class="vd vd-${r.v}">${L[r.v]}</span><div><div class="vd-h">${esc(r.h)}</div>${r.d?`<p>${esc(r.d)}</p>`:''}</div></div>`;

 return`<h2 class="sec">Verificador de composición</h2><p class="lede">Escribí una afirmación sobre cuántos integrantes tiene un bloque, si tiene mayoría o cuál es el bloque más grande. NEWAR la contrasta con la nómina cargada y te dice si es <b>verdadera</b>, <b>falsa</b> o <b>no se puede verificar</b>, mostrando la cuenta. No opina ni juzga: solo compara números con datos públicos.</p><div class="ctl"><input id="verq" type="search" aria-label="Afirmación a verificar" placeholder="Ej.: Todos Por Salta tiene 40 diputados provinciales" value="${esc(VER.q)}" onkeydown="if(event.key==='Enter')verGo(this.value)" style="flex:1;min-width:14rem"><button type="button" class="on" onclick="verGo(document.getElementById('verq').value)">Verificar</button></div>${ex.length?`<p class="note">Para probar: ${ex.map(x=>`<button type="button" class="pill" data-ver="${esc(x)}">${esc(x)}</button>`).join(' ')}</p>`:''}${res}<p class="note">Los ejemplos con cifras falsas están hechos a propósito para mostrar cómo responde. Verifica solo composición según la nómina cargada.</p>`};

V.voz=()=>{const lim=Date.now()-VOZ.dias*864e5,g=verGrupos(VOZ.cam),N=g.reduce((a,x)=>a+x.w,0)||1;

 const body=rows.map(r=>{const ps=r.w/N*100,pm=T?r.n/T*100:0,ix=r.b==='Sin dato de bloque'||!T?'—':r.n<3?'sin muestra suficiente':fx(pm/ps);return`<div class="vp"><div class="vp-h"><b>${esc(r.b)}</b><span class="meta">${r.w} banca${r.w>1?'s':''} · ${r.n} ${r.n===1?'mención':'menciones'}</span><span class="tag ind" title="Menciones ÷ bancas (1 = proporcional). Con menos de 3 menciones no se calcula.">${ix==='sin muestra suficiente'?ix:'índice '+ix}</span></div><div class="vp-r"><span>Bancas ${fx(ps)} %</span><div class="tr"><i class="s" style="width:${ps}%"></i></div></div><div class="vp-r"><span>Menciones ${fx(pm)} %</span><div class="tr"><i class="m" style="width:${pm}%"></i></div></div></div>`}).join('');

V.destacados=()=>{setTimeout(()=>{document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{setStars(stars().filter(s=>s.id!==b.dataset.id));route()})});
 const l=stars().sort((a,b)=>(b.starred_at||'').localeCompare(a.starred_at||''));
 return`<h2 class="sec">Destacados</h2><p class="lede"><b>Guardados solo en este navegador</b>: no se suben al repositorio ni se comparten entre dispositivos.</p>${l.length?l.map(i=>`<div class="art"><div><span class="pill">${esc(i.type||'item')}</span><a href="${esc(safe(i.link))}" target="_blank" rel="noopener">${esc(i.title)}</a><div class="meta">${esc(i.source||'')} ${i.date?'· '+fdate(i.date):''}</div></div><button class="more rm" style="margin:0" data-id="${esc(i.id)}">Quitar</button></div>`).join(''):'<p class="empty">Todavía no destacaste nada. Buscá el ícono ☆ en menciones, citas y publicaciones.</p>'}`};

V.control=()=>{
 const hoy=new Date(),L=[],add=(e,t,d)=>L.push([e,t,d||'']);
 const TG={ok:'<span class="tag vigente">ok</span>',av:'<span class="tag warnc">revisar</span>',er:'<span class="tag negativo">problema</span>'};
 const edad=d=>d?(hoy-d)/36e5:null,txtEdad=h=>h==null?'sin fecha':h<48?Math.round(h)+' h':Math.round(h/24)+' días';
 [['aggregates.json',S.agg&&S.agg.generated_at],['events.json',S.ev&&S.ev.generated_at],['oficiales.json',S.of&&S.of.generated_at],['oficiales_status.json',S.ofst&&S.ofst.generated_at],['topics_data.json',S.top&&S.top.generated_at]].forEach(([n,g])=>{
  const d=pd(g),h=edad(d);add(h==null?'av':h>168?'er':h>36?'av':'ok','Frescura de '+n,d?'Generado el '+fdate(d)+' (hace '+txtEdad(h)+'). El recolector corre varias veces por día: más de 36 h sin cambios indica que dejó de actualizar.':'No trae fecha de generación.')});
 const cnt=(f)=>personas.filter(f).length,venc=cnt(p=>p.v===0&&p.sinConf),vig=cnt(p=>p.v===1),ex=cnt(p=>p.v===0&&!p.sinConf),sd=cnt(p=>p.v===null);
 add('ok','Vigencia calculada con la fecha de hoy',`${vig} vigentes · ${ex} no vigentes confirmados · ${venc} con mandato vencido sin confirmar · ${sd} sin dato. Se recalcula cada vez que se abre la página; no depende de un campo escrito a mano.`);
 if(venc){const rec=personas.filter(p=>p.v===0&&p.sinConf&&(PM[p.id]||[]).some(m=>m._d&&hoy-m._d<90*864e5)).length;
  add('av','Mandatos vencidos sin confirmar reelección',`${venc} personas figuran con un mandato que terminó según el registro (fuente no oficial). Con esa fuente no se puede saber si fueron reelectas. ${rec} de ellas tienen menciones en los últimos 90 días (es una señal de actividad, no una prueba de vigencia). Después de cada elección hay que actualizar <code>politicians.json</code> desde una fuente oficial, o confirmar caso por caso en <code>data/resoluciones.json</code> (<code>periodos</code>).`)}
 if(sd)add('av','Personas sin dato de vigencia',personas.filter(p=>p.v===null).map(p=>esc(p.nombre)+' ('+esc(p.cargo)+')').join('; ')+'. Les falta fuente oficial o período en la nómina.');
 const fus=personas.filter(p=>p.fusion.length);
 add(fus.length?'ok':'ok','Cargos sucesivos unificados',fus.length?fus.map(p=>`<b>${esc(p.nombre)}</b>: ${p.fusion.map(f=>esc(f.conf)).join(', ')} (${p.cargos.map(c=>esc(c.titulo)).join(' → ')})`).join('<br>'):'Ninguna fila repetida.');
 add(homonimos.length?'av':'ok','Homónimos sin resolver',homonimos.length?homonimos.map(h=>`<b>${esc(h.nombre)}</b>: ${esc(h.motivo)}`).join('<br>'):'No hay casos en duda.');
 add('ok','Menciones duplicadas descartadas',CTRL.menDup?`${CTRL.menDup} menciones repetidas (la misma nota atribuida dos veces a una persona que figura en dos filas, por ejemplo diputado y después senador). Se cuentan una sola vez; es un ajuste esperado, no un error.`:'No hay duplicados.');
 add(CTRL.menHuerf?'er':'ok','Menciones sin persona en la nómina',CTRL.menHuerf?`${CTRL.menHuerf} menciones apuntan a un identificador que no existe en <code>politicians.json</code>.`:'Todas las menciones apuntan a una persona de la nómina.');
 const dosH=Object.keys(S.dos||{}).filter(i=>!byId[i]);add(dosH.length?'av':'ok','Fichas (dossiers) huérfanas',dosH.length?`${dosH.length} ficha(s) de personas que ya no están en la nómina: ${dosH.map(esc).join(', ')}. NEWAR las ignora.`:'Sin fichas huérfanas.');
 const ofH=[...new Set((S.of.items||[]).flatMap(i=>i.personas||[]).filter(i=>!byId[i]))];add(ofH.length?'er':'ok','Publicaciones oficiales con personas inexistentes',ofH.length?ofH.map(esc).join(', '):'Todas las personas nombradas existen en la nómina.');
 add(CTRL.menSinFecha?'av':'ok','Menciones sin fecha válida',CTRL.menSinFecha?`${CTRL.menSinFecha} menciones no tienen fecha legible y quedan fuera de los gráficos.`:'Todas las menciones tienen fecha.');
 const viejas=MEN.filter(m=>m._d&&hoy-m._d>730*864e5).length;add(viejas?'av':'ok','Menciones de más de 2 años',viejas?`${viejas} menciones son de hace más de 2 años. Se muestran con su fecha real y no entran en los gráficos de últimos días.`:'No hay menciones antiguas.');
 const bdKeys=Object.keys((S.agg&&S.agg.by_day)||{});const roto=bdKeys.length&&!bdKeys.every(k=>/^\d{4}-\d{2}-\d{2}/.test(k));
 add(roto?'av':'ok','Fechas del archivo aggregates.json',roto?'<code>by_day</code> y los tonos por día de <code>dossiers.json</code> traen fechas cortadas (por ejemplo «Sun, 20 Se»: sin año y con el mes incompleto). NEWAR no las usa: recalcula todo desde <code>mentions.json</code>, que sí trae la fecha completa. Conviene corregir el recolector.':'Las fechas de los agregados son completas.');
 const auto=((S.agg&&S.agg.comentions)||[]).filter(c=>c.a===c.b).length;add(auto?'av':'ok','Cruces de una persona consigo misma',auto?`${auto} «menciones cruzadas» del archivo emparejan a una persona con ella misma (efecto de tener dos filas). NEWAR recalcula los cruces.`:'Sin cruces inválidos.');
 const ph=Object.values((S.top&&S.top.topics)||{}).filter(esPlaceholder).length;add(ph?'av':'ok','Temas de ejemplo ocultos',ph?`${ph} tema(s) de ejemplo en <code>topics.json</code> no se muestran. Reemplazalos o borralos.`:'Sin temas de ejemplo.');
 const sf=(S.of.items||[]).filter(i=>!i.fecha_publicacion).length,tot=(S.of.items||[]).length;add(sf?'av':'ok','Publicaciones oficiales sin fecha de publicación',tot?`${sf} de ${tot} no traen fecha de publicación; se ordenan por la fecha en que el recolector las vio por primera vez.`:'No hay publicaciones oficiales.');
 const fs=Object.values((S.ofst||{}).sources||{}).filter(s=>s.state!=='ok');add(fs.length?'er':'ok','Fuentes oficiales con problemas',fs.length?fs.map(s=>`<b>${esc(s.name)}</b> (${esc(s.state)}): ${esc(s.message)}`).join('<br>'):'Todas las fuentes respondieron.');
 const sinM=personas.filter(p=>!(PM[p.id]||[]).length).length;add('ok','Cobertura de prensa',`${personas.length-sinM} de ${personas.length} personas tienen al menos una mención; ${sinM} no tienen ninguna.`);
 /* Nómina oficial (scripts/nomina.py + data/nomina_status.json) */
 const NS=S.nomst||{},nsrc=Object.values(NS.sources||{}),gN=pd(NS.generated_at),hN=edad(gN);
 add(hN==null?'av':hN>72?'er':hN>36?'av':'ok','Frescura de nomina_status.json',gN?`La nómina se verificó contra los sitios oficiales el ${fdate(gN)} (hace ${txtEdad(hN)}). Corre una vez por día (06:30 de Argentina): más de 36 h indica que el recolector de la nómina no está corriendo.`:'No se pudo leer <code>nomina_status.json</code>: no se sabe cuándo se verificó la nómina por última vez.');
 const nBad=nsrc.filter(x=>x.state!=='ok'&&x.state!=='manual'),nMan=nsrc.filter(x=>x.state==='manual');
 add(nBad.length?'er':(nsrc.length?'ok':'av'),'Fuentes de la nómina',nBad.length?nBad.map(x=>`<b>${esc(x.name)}</b> (${esc(x.state)}): ${esc(x.message)}`).join('<br>'):(nsrc.length?'Todas las cámaras con lectura automática respondieron: '+nsrc.filter(x=>x.state==='ok').map(x=>esc(x.name)+' — '+esc(x.message)).join(' · '):'No hay estado de la nómina disponible.'));
 if(nMan.length)add('av','Nómina cargada a mano',nMan.map(x=>`<b>${esc(x.name)}</b>: ${esc(x.message)}`).join('<br>'));
 const sinVer=(S.pol||[]).filter(r=>!r.verificado_en);
 if(sinVer.length)add('av','Filas que el recolector no verifica solo',sinVer.map(r=>esc(r.name)+' ('+esc(r.cargo||r.role||r.chamber)+')').join('; ')+'. Para confirmar su vigencia, agregá una fuente oficial en <code>data/resoluciones.json</code> (<code>periodos</code>).');
 const exN=(S.pol||[]).filter(r=>r.vigencia==='ex').length;
 if(exN)add('ok','Personas que ya no figuran en la nómina oficial',`${exN} filas figuran como «ex»: estaban en la lista y la nómina oficial ya no las incluye. Se conservan como historial y el monitor ya no busca prensa nueva sobre ellas.`);
 const n={er:L.filter(x=>x[0]==='er').length,av:L.filter(x=>x[0]==='av').length};
 return`<h2 class="sec">Control de datos</h2><p class="lede">Controles automáticos que se recalculan con la fecha de hoy cada vez que se abre la página. Sirven para saber qué parte de lo que se ve está desactualizada, en duda o inconsistente. ${n.er?`<b>${n.er} problema(s)</b> y `:''}<b>${n.av} punto(s) a revisar.</b></p>${L.map(([e,t,d])=>`<div class="row2"><span>${TG[e]} <b>${esc(t)}</b><br><span class="meta">${d}</span></span></div>`).join('')}<footer>Las decisiones humanas (unir o separar dos filas, confirmar un mandato) se anotan en <code>data/resoluciones.json</code>; ese archivo no lo toca el recolector, así que sobrevive a cada actualización.</footer>`};

/* ---------- Datos en vivo: verifica cambios cada minuto y recarga sola; conserva filtros y posición ---------- */
const LIVE={every:60000,last:0,lastOk:0,sig:null,ok:true,busy:false};let KEEP=false,DIA='';
const fpub=(v,alt)=>{const d=pd(v);return d?`<time class="pub" datetime="${d.toISOString()}">Publicada el ${esc(fdate(d,{dateStyle:'medium',timeStyle:'short'}))}</time>`:`<span class="pub nd">Fecha de publicación no informada${alt&&pd(alt)?' (detectada el '+esc(fdate(alt,{dateStyle:'medium'}))+')':''}</span>`};
const relT=d=>`<time class="rel" data-ts="${+d}">${esc(rel(d))}</time>`;
const bases=n=>['data/'+n+'.json'].concat(location.href.startsWith(REMOTO.replace(/data\/$/,''))?[]:[REMOTO+n+'.json']);
async function firma(){
 const ns=['aggregates','mentions','oficiales','news_general','oficiales_status','politicians','nomina_status'],out=[];let alguna=false;
 for(const n of ns){let s=null;
  for(const u of bases(n)){try{const r=await fetch(u+'?_='+Date.now(),{method:'HEAD',cache:'no-store'});if(r.ok){s=r.headers.get('etag')||r.headers.get('last-modified')||null;if(s){alguna=true;break}}}catch(e){}}
  out.push(n+'='+s)}
 if(alguna)return out.join('|');
 /* Sin cabeceras legibles (p. ej. otro origen): se compara la fecha de generación de dos archivos chicos */
 const a=await leer('aggregates'),o=await leer('oficiales_status');
 if(a===undefined&&o===undefined)throw new Error('sin conexión');
 return 'g='+(a&&a.generated_at)+'|'+(o&&o.generated_at)}
function capturar(){const st={y:window.scrollY,v:{},rb:null};document.querySelectorAll('#app input[id],#app select[id]').forEach(e=>{st.v[e.id]=e.type==='checkbox'?e.checked:e.value});
 const b=document.querySelector('#rb button.on');if(b)st.rb=b.dataset.h;return st}
function restaurar(st){Object.entries(st.v).forEach(([id,v])=>{const e=document.getElementById(id);if(!e)return;if(e.type==='checkbox')e.checked=v;else e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}))});
 if(st.rb!=null){const b=document.querySelector('#rb button[data-h="'+st.rb+'"]');if(b)b.click()}window.scrollTo(0,st.y)}
function aviso(t){const e=$('#toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(aviso.t);aviso.t=setTimeout(()=>e.classList.remove('on'),7000)}
async function recargar(force){
 const ks=[...new Set(['pol','agg','men','res',...Object.keys(LOAD)])],nuevo={};let fallo=0;
 await Promise.all(ks.map(async k=>{const v=await leer(SRC[k][0]);if(v===undefined){if(!SRC[k][2])fallo++}else nuevo[k]=v}));
 if(fallo&&!Object.keys(nuevo).length)throw new Error('sin datos');
 const sgP=pols=>(pols||[]).map(p=>p.id+':'+p.vigencia).join(),prev={men:MEN.length,of:((S.of||{}).items||[]).length,news:(S.news||[]).length,gen:GEN&&+GEN,nom:sgP(S.pol)};
 Object.assign(S,nuevo);S.polById={};S.pol.forEach(p=>S.polById[p.id]=p);build();DIA=dkey(new Date());
 GEN=pd(S.agg&&S.agg.generated_at);updTxt();FAIL.length=0;
 const st=capturar();KEEP=true;await route();setTimeout(()=>restaurar(st),0);
 const d=[];const dm=MEN.length-prev.men,dof=((S.of||{}).items||[]).length-prev.of,dn=(S.news||[]).length-prev.news;
 const pl=(n,a,b)=>'+'+n+' '+(n===1?a:b);if(dm>0)d.push(pl(dm,'mención','menciones'));if(dof>0)d.push(pl(dof,'publicación oficial','publicaciones oficiales'));if(dn>0&&nuevo.news)d.push(pl(dn,'noticia','noticias'));if(nuevo.pol&&sgP(S.pol)!==prev.nom)d.push('nómina de legisladores actualizada');
 aviso(d.length?'Datos actualizados: '+d.join(', ')+'.':(force?'Datos verificados: no hay novedades.':'Datos actualizados.'))}
async function verificar(force){
 if(LIVE.busy||window.NEWAR_EMBED)return;LIVE.busy=true;pintaLive(true);
 try{const sg=await firma();LIVE.lastOk=Date.now();LIVE.ok=true;const cambio=LIVE.sig!==null&&sg!==LIVE.sig;LIVE.sig=sg;
  if(force||cambio)await recargar(force)}
 catch(e){LIVE.ok=false;if(force)aviso('No se pudo conectar. Se reintenta automáticamente.')}
 LIVE.last=Date.now();LIVE.busy=false;pintaLive()}
function pintaLive(chk){const e=$('#live');if(!e)return;
 if(window.NEWAR_EMBED){e.innerHTML='<span class="dot r"></span>Versión sin conexión (foto fija)';return}
 const h=GEN?(Date.now()-GEN)/36e5:null;let c='g';if(!LIVE.ok||h==null||h>36)c='r';else if(h>6)c='a';
 const et=!LIVE.ok?'Sin conexión':(h!=null&&h<=6?'En vivo':'Conectado');
 e.innerHTML=`<span class="dot ${c}" title="Verde: datos de las últimas 6 h · Ámbar: hasta 36 h · Rojo: más de 36 h o sin conexión"></span>${et} · ${chk?'verificando…':(LIVE.lastOk?'verificado '+esc(rel(LIVE.lastOk)):'verificando…')}`}
function pulso(){document.querySelectorAll('time.rel').forEach(e=>{e.textContent=rel(+e.dataset.ts)});pintaLive();
 if(personas.length&&DIA&&dkey(new Date())!==DIA){DIA=dkey(new Date());build();const st=capturar();KEEP=true;route().then(()=>setTimeout(()=>restaurar(st),0))}}
function arrancaVivo(){if(window.NEWAR_EMBED){pintaLive();return}
 DIA=dkey(new Date());firma().then(s=>{LIVE.sig=s;LIVE.lastOk=Date.now();LIVE.ok=true;pintaLive()}).catch(()=>{LIVE.ok=false;pintaLive()});
 setInterval(()=>{if(!document.hidden)verificar(false)},LIVE.every);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-LIVE.last>30000)verificar(false)});
 window.addEventListener('online',()=>verificar(false));
 const b=$('#lvb');if(b)b.addEventListener('click',()=>verificar(true))}

/* ---------- Router ---------- */
const TABS=[['inicio','Inicio'],['diario','Diario'],['buscar','Buscar'],['personas','Personas'],['ejecutivo','Ejecutivo'],['legislativo','Legislativo'],['menciones','Menciones'],['medios','Medios'],['temas','Temas'],['palabras','Palabras'],['cruce','Cruce'],['mayorias','Mayorías'],['hemiciclo','Hemiciclo'],['mapa','Mapa'],['verificar','Verificar'],['voz','Voz y peso'],['red','Red'],['casos','Casos'],['calidad','Calidad'],['fuentes','Fuentes'],['eventos','Eventos'],['resumen','Resumen'],['oficiales','Oficiales'],['destacados','Destacados'],['control','Control']];
const NEEDS={inicio:['top','ev','of'],medios:[],personas:[],persona:['dos','of','cur'],ejecutivo:['cur'],legislativo:['cur'],menciones:[],palabras:[],palabra:[],cruce:[],red:[],calidad:['cur'],mayorias:[],mapa:[],hemiciclo:[],diario:[],verificar:[],voz:[],casos:[],buscar:['cur'],fuentes:[],temas:['top','tm'],tema:['top','tm'],eventos:['ev'],resumen:['news'],oficiales:['of','ofst'],destacados:[],control:['top','ev','news','of','ofst','dos','tm','nomst']};
const SITIO='https://nexxusconsultora-lab.github.io/salta-monitor/';
let firstRoute=true,rt=0;
async function route(){const my=++rt;const keep=KEEP;KEEP=false;const [v,arg,arg2]=(location.hash.replace(/^#\/?/,'')||'inicio').split('/');const name=V[v]?v:'inicio',id=arg?decodeURIComponent(arg):'',id2=arg2?decodeURIComponent(arg2):'';
 const tab=(name==='persona')?'personas':(name==='tema'?'temas':(name==='palabra'?'palabras':name));
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#/${k}" class="${k===tab?'on':''}"${k===tab?' aria-current="page"':''}>${l}</a>`).join('');
 const ns=NEEDS[name]||[];
 if(ns.some(k=>!(k in S))){$('#app').innerHTML='<p class="empty" role="status">Cargando datos…</p>';await need(...ns);if(my!==rt)return}
 const fr=GEN&&Date.now()-GEN>36*36e5?`<p class="warn" role="status"><b>Los datos no se actualizan desde ${esc(rel(GEN).replace('hace ',''))}.</b> La última corrida del recolector fue el ${esc(fdate(GEN))}. Lo que ves refleja esa fecha, no el día de hoy (por eso los gráficos de «últimos días» pueden estar vacíos). Revisá la pestaña <a href="#/control">Control</a>.</p>`:'';
 const aviso=fr+(!FAIL.length?'':(location.protocol==='file:'&&!window.NEWAR_EMBED
  ?`<p class="warn" role="alert"><b>Abriste NEWAR directamente desde un archivo.</b> Así el navegador bloquea la lectura de los datos. Entrá al sitio publicado: <a href="${esc(SITIO)}">${esc(SITIO)}</a>, o pedí la versión sin conexión (<code>newar-offline.html</code>).</p>`
  :`<p class="warn" role="alert">No se pudieron cargar estos datos: <code>${esc(FAIL.join(', '))}</code>. Lo que ves puede estar incompleto o vacío. Probá recargar la página.</p>`));
 $('#app').innerHTML=aviso+V[name](id,id2);if(!keep)window.scrollTo(0,0);
 document.title='NEWAR — '+(name==='persona'&&byId[id]?byId[id].nombre:(TABS.find(t=>t[0]===tab)||[0,'Inicio'])[1]);
 const h=$('#app h2');if(!firstRoute&&h&&!keep){h.tabIndex=-1;h.focus({preventScroll:true})}firstRoute=false}

/* Reloj: hora actual del dispositivo, actualizada cada minuto (alineada al cambio de minuto) */
function updTxt(){const e=$('#upd');if(!e||!GEN)return;e.textContent='Datos al '+fdate(GEN)+' · '+rel(GEN);e.style.color=Date.now()-GEN>36*36e5?'var(--negtx)':''}
function tick(){updTxt();if(typeof pulso==='function')pulso();const el=$('#clock');if(!el)return;const d=new Date();
 el.textContent=d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
 el.setAttribute('datetime',d.toISOString())}
function startClock(){tick();const w=60000-(Date.now()%60000)+50;setTimeout(()=>{tick();setInterval(tick,60000)},w)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
startClock();
$('#skip').addEventListener('click',()=>$('#app').focus());
window.addEventListener('hashchange',route);
(async()=>{
 await need('pol','agg','men','res');S.polById={};S.pol.forEach(p=>S.polById[p.id]=p);build();
 GEN=pd(S.agg&&S.agg.generated_at);updTxt();
 await route();arrancaVivo()})();
</script>
