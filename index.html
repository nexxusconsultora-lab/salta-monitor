<style>
/* Tipografías alojadas en el repositorio (licencia OFL, ver fonts/LICENSE-*.txt). Subset latin: cubre español completo. */
@font-face{font-family:Newsreader;font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/newsreader-latin-opsz-normal.woff2) format('woff2')}
@font-face{font-family:Newsreader;font-style:italic;font-weight:200 800;font-display:swap;src:url(fonts/newsreader-latin-opsz-italic.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}
:root{--paper:#F3EEE2;--raised:#FBF8F1;--ink:#211D1A;--soft:#5C554C;--line:#D9D1BF;--clay:#B1502E;--indigo:#2B3A55;--pos:#4C7A5D;--neg:#8B3A3A;--neu:#6F665A;--warn:#F6E7D8;--onind:#fff;--onclay:#fff;--negtx:#8B3A3A}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#211D1A;--raised:#2B2621;--ink:#F3EEE2;--soft:#B9B0A0;--line:#45403A;--clay:#D97A52;--indigo:#9DB1D8;--warn:#3a2c22;--onind:#211D1A;--onclay:#211D1A;--negtx:#E59A9A}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Newsreader,Georgia,serif}a{color:inherit}
code{background:var(--paper);border:1px solid var(--line);padding:0 .3rem;border-radius:2px;font-size:.85em}
nav.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--ink);padding:.7rem 1.25rem 0;padding-top:calc(.7rem + env(safe-area-inset-top,0px))}
nav .row{max-width:1100px;margin:0 auto;display:flex;align-items:baseline;gap:1.5rem;flex-wrap:wrap}
nav h1{margin:0;font-size:1.4rem}nav .upd{font-size:.78rem;color:var(--soft);margin-left:auto;text-align:right;display:flex;flex-direction:column;line-height:1.3}nav .upd b{font-size:.95rem;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;text-transform:capitalize}
nav .tabs{display:flex;gap:.2rem;overflow-x:auto;max-width:1100px;margin:.3rem auto 0;scrollbar-width:thin}
nav .tabs a{padding:.45rem .8rem;text-decoration:none;font-size:.9rem;font-weight:500;color:var(--soft);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
nav .tabs a.on{color:var(--ink);border-color:var(--clay);font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h2.sec{font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--ink);padding-bottom:.4rem;margin:2rem 0 1rem}
h2.sec:first-child{margin-top:0}
.lede{color:var(--soft);max-width:70ch;font-size:.95rem;margin:0 0 1.25rem}
.empty{color:var(--soft);font-size:.9rem}.note{font-size:.8rem;color:var(--soft)}
.ctl{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.ctl input,.ctl select,.ctl button{font:inherit;font-size:.9rem;padding:.5rem .7rem;border:1px solid var(--ink);background:var(--raised);color:var(--ink)}
.ctl input[type=search]{flex:1 1 240px}.ctl button{cursor:pointer}.ctl button.on{background:var(--indigo);color:var(--onind)}
.ctl label{display:flex;align-items:center;gap:.35rem;font-size:.85rem}.ctl input[type=checkbox]{padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.card{display:block;text-decoration:none;background:var(--raised);border:1px solid var(--line);padding:1rem 1.2rem}
a.card:hover{border-color:var(--ink)}.card .n{font:700 1.8rem Newsreader,serif}.card .l{font-size:.8rem;color:var(--soft)}
.row2{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:.65rem 0;border-bottom:1px solid var(--line)}
a.row2{text-decoration:none}a.row2:hover{background:var(--raised)}
.nm{font-weight:600;overflow-wrap:anywhere}.meta{font-size:.8rem;color:var(--soft)}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:.1rem .5rem;border-radius:2px;color:#fff;background:var(--neu)}
.tag.vigente,.tag.positivo{background:var(--pos)}.tag.negativo{background:var(--neg)}.tag.no-vigente,.tag.neutral{background:var(--neu)}
.flag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--onclay);background:var(--clay);padding:.1rem .5rem;border-radius:2px;margin:.15rem .3rem 0 0}
.warn{display:block;margin:.5rem 0;font-size:.82rem;background:var(--warn);border-left:3px solid var(--clay);padding:.5rem .75rem}
.person{background:var(--raised);border:1px solid var(--line);padding:1.25rem 1.5rem}.person h2{margin:0 0 .2rem;font-size:1.7rem;overflow-wrap:anywhere}
.cargo{border-left:3px solid var(--indigo);padding:.4rem 0 .4rem 1rem;margin-bottom:.8rem}
.sh{font:700 .82rem/1.5 Inter,system-ui,sans-serif;margin:1.5rem 0 .5rem;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}.sh.neg{color:var(--negtx)}
.boxes{display:flex;gap:.6rem;flex-wrap:wrap}.box{border:1px solid var(--line);padding:.4rem .9rem;background:var(--paper)}.box b{display:block;font:700 1.4rem Newsreader,serif}.box span{font-size:.75rem;color:var(--soft)}
.bars{display:flex;align-items:center;gap:2px;height:90px;border-bottom:1px solid var(--line)}
.bars i{flex:1;min-width:2px;background:var(--pos);align-self:flex-end}.bars i.n{background:var(--negtx)}
.bars .z{flex:1;height:100%;display:flex;align-items:flex-end}.bars .z i{display:block;width:100%;flex:none}

.art .t{font:600 1.05rem/1.35 Newsreader,serif;margin:.15rem 0 0}.art .t a{text-decoration:none}.art .t a:hover{text-decoration:underline}
.quote{border-left:3px solid var(--clay);padding:.3rem 0 .3rem 1rem;margin:.6rem 0;font:italic 1.05rem Newsreader,serif}

.pcol{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:2rem}@media(max-width:860px){.pcol{grid-template-columns:minmax(0,1fr)}}
.pnl{background:var(--raised);border:1px solid var(--line);padding:1rem;margin-bottom:1rem}
.more{font:inherit;padding:.55rem 1rem;border:1px solid var(--ink);background:var(--raised);color:var(--ink);cursor:pointer;margin-top:1rem}
details summary{cursor:pointer;color:var(--indigo);font-weight:600;font-size:.88rem}
.ev{border-bottom:1px solid var(--line);padding:.4rem 0;font-size:.82rem;color:var(--soft);overflow-wrap:anywhere}.ev b{color:var(--ink)}
footer{font-size:.78rem;color:var(--soft);border-top:1px solid var(--line);padding-top:1rem;margin-top:2.5rem}
/* Responsive y accesibilidad */
.tag.ind{background:var(--indigo);color:var(--onind)}
.tag.warnc{background:#8a6a1f}
.lv{font:inherit;font-size:1.1rem;line-height:1;border:1px solid var(--ink);background:var(--raised);color:var(--ink);cursor:pointer;min-width:2.2rem;min-height:2.2rem;border-radius:2px}
#live{font-size:.72rem}#live .dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.35rem;background:var(--neu)}#live .dot.g{background:var(--pos)}#live .dot.a{background:#C99A3A}#live .dot.r{background:var(--neg)}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--ink);color:var(--paper);padding:.6rem 1rem;font-size:.88rem;z-index:20;max-width:90vw;transition:transform .25s;border-radius:2px}.toast.on{transform:translate(-50%,0)}
.ctl select,.ctl input{min-width:0;max-width:100%}.ctl select{text-overflow:ellipsis}
.art>div{min-width:0}.art .t,.art .meta{overflow-wrap:anywhere}
.star{flex:none;min-width:2rem;min-height:2rem}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
#app:focus,#app h2:focus{outline:none}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.6rem 1rem;z-index:10;border:0;font:inherit;cursor:pointer}.skip:focus{left:.5rem;top:calc(.5rem + env(safe-area-inset-top,0px))}
</style>
</head>

<button class="skip" id="skip" type="button">Saltar al contenido</button>
<nav class="top" aria-label="Secciones de NEWAR"><div class="row"><h1>NEWAR</h1><span class="upd"><b id="clock" aria-hidden="true"></b><span id="upd"></span><span id="live" role="status"></span></span><button class="lv" id="lvb" type="button" aria-label="Actualizar datos ahora" title="Actualizar ahora">↻</button></div><div class="tabs" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<main class="wrap" id="app" tabindex="-1"><p class="empty">Cargando datos…</p></main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const FAIL=[];
const REMOTO='https://nexxusconsultora-lab.github.io/salta-monitor/data/';
const bajar=async(url)=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);try{const r=await fetch(url+'?_='+Date.now(),{signal:ac.signal,cache:'no-store'});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(to)}};
/* leer(): 1) data/ local; 2) si falla (p. ej. abierto con doble clic desde la PC: file:// bloquea fetch) se leen los datos del sitio publicado. Devuelve undefined si no pudo. */
const leer=async n=>{try{return await bajar('data/'+n+'.json')}catch(e){}
 if(!location.href.startsWith(REMOTO.replace(/data\/$/,''))){try{return await bajar(REMOTO+n+'.json')}catch(e){}}
 return undefined};
const J=async(n,fb,opt)=>{if(window.NEWAR_EMBED&&n in NEWAR_EMBED)return NEWAR_EMBED[n];const v=await leer(n);if(v!==undefined)return v;if(!opt)FAIL.push(n);return fb};
/* Cada vista pide solo los archivos que usa; se descargan una vez y quedan en memoria */
const S={};const SRC={res:['resoluciones',{},true],tm:['topic_mentions',[]],pol:['politicians',[]],agg:['aggregates',null],men:['mentions',[]],dos:['dossiers',{}],top:['topics_data',{topics:{}}],ev:['events',{events:[]}],news:['news_general',[]],of:['oficiales',{items:[]}],ofst:['oficiales_status',{sources:{}}],nomst:['nomina_status',{sources:{}},true]};
const LOAD={};const need=(...ks)=>Promise.all(ks.map(k=>LOAD[k]||(LOAD[k]=J(SRC[k][0],SRC[k][1],SRC[k][2]).then(v=>(S[k]=v)))));
const fdate=(v,o)=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('es-AR',o||{dateStyle:'short',timeStyle:'short'})};
function rel(d){const s=(Date.now()-d)/1000;if(s<0)return'ahora';if(s<3600)return`hace ${Math.max(1,Math.round(s/60))} min`;if(s<86400)return`hace ${Math.round(s/3600)} h`;if(s<604800)return`hace ${Math.round(s/86400)} d`;return fdate(d,{dateStyle:'medium'})}
/* Destacados (misma clave que el Radar: las estrellas existentes se conservan) */
const SK='radar_destacados_v1';
const stars=()=>{try{return JSON.parse(localStorage.getItem(SK)||'[]')}catch(e){return[]}};
const setStars=l=>{try{localStorage.setItem(SK,JSON.stringify(l))}catch(e){}};
const isStar=id=>stars().some(s=>s.id===id);
const starLbl=(on,t)=>(on?'Quitar de destacados: ':'Destacar: ')+String(t||'').slice(0,90);
const starBtn=m=>{const on=isStar(m.id);return`<button class="star${on?' on':''}" data-m="${encodeURIComponent(JSON.stringify(m))}" aria-pressed="${on}" aria-label="${esc(starLbl(on,m.title))}" title="Destacar (solo en este navegador)">${on?'★':'☆'}</button>`};
document.addEventListener('click',e=>{const b=e.target.closest('.star');if(!b)return;let m;try{m=JSON.parse(decodeURIComponent(b.dataset.m))}catch(x){return}
 const l=stars(),i=l.findIndex(s=>s.id===m.id);if(i>=0)l.splice(i,1);else l.push({...m,starred_at:new Date().toISOString()});setStars(l);
 const on=i<0;b.textContent=on?'★':'☆';b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',starLbl(on,m.title))});

/* ---------- Modelo NEWAR: persona / cargo / evidencia. Todo se CALCULA con la fecha de hoy y los datos vigentes: nada fijo a mano ---------- */
const INST={'Ejecutivo':['Poder Ejecutivo de Salta','Provincia de Salta','provincial'],'Diputados':['Cámara de Diputados de Salta','Provincia de Salta','provincial'],'Senado':['Cámara de Senadores de Salta','Provincia de Salta','provincial'],'Concejo Deliberante':['Concejo Deliberante de la Ciudad de Salta','Municipio de la Ciudad de Salta','municipal'],'Diputados de la Nación':['Cámara de Diputados de la Nación','República Argentina','nacional'],'Senado de la Nación':['Cámara de Senadores de la Nación','República Argentina','nacional']};
let personas=[],byId={},homonimos=[],MEN=[],PM={},CTRL={},GEN=null,NOMTOK=new Set();
const pd=v=>{if(v==null||v==='')return null;const d=new Date(v);return isNaN(d)?null:d};
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const anio=v=>{const n=parseInt(String(v==null?'':v).slice(0,4),10);return isNaN(n)?null:n};
const esOficial=u=>/^https?:\/\/([a-z0-9-]+\.)*(gob|gov)\.ar(\/|$)/i.test(u||'');
const limpiaRol=r=>String(r||'').replace(/\s*\((mandato|periodo)[^)]*\)/i,'').replace(/\s*[—-]\s*mandato vigente en [a-záéíóú]+ de \d{4}/i,'').replace(/\s*\(Concejo Deliberante\)/i,'').trim();
const notaRol=r=>{const m=String(r||'').match(/\((mandato[^)]*)\)|[—-]\s*(mandato vigente en [a-záéíóú]+ de \d{4})/i);return m?(m[1]||m[2]):''};
/* Vigencia = f(período registrado, tipo de fuente, fecha de HOY). Nunca se lee de un campo escrito a mano. */
function vigDe(p,hoy){
 const R=((S.res||{}).periodos||{})[p.id];
 if(R&&typeof R.vigente==='boolean')return{v:R.vigente?1:0,sinConf:false,txt:'Confirmado por una persona'+(R.fuente?' ('+R.fuente+')':'')};
 /* Nómina oficial: el recolector (scripts/nomina.py) lee el sitio oficial y deja vigencia + verificado_en. Se usa solo si la fila trae fecha de verificación; "vigente" además exige fuente oficial. */
 const vf=p.verificado_en?fdate(p.verificado_en,{dateStyle:'medium'}):'';
 if(vf&&p.vigencia==='ex'){const xd=p.ex_desde?fdate(p.ex_desde,{dateStyle:'medium'}):'';return{v:0,sinConf:false,txt:'Ya no figura en la nómina oficial'+(xd?' (el recolector lo detectó el '+xd+')':'')+'; verificado el '+vf}}
 if(vf&&p.vigencia==='vigente'&&esOficial(p.source_url)){const e0=anio(p.term_end),y0=hoy.getFullYear();return{v:1,sinConf:false,txt:'Figura en la nómina oficial (verificado el '+vf+')'+(e0!=null&&e0<y0?'. El período registrado ('+e0+') está desactualizado: manda la nómina oficial':'')}}
 const y=hoy.getFullYear(),s=anio(p.term_start),e=anio(p.term_end),of=esOficial(p.source_url);
 if(s!=null&&s>y)return{v:null,sinConf:false,txt:'El período registrado empieza recién en '+s};
 if(e!=null){
  if(e<y)return{v:0,sinConf:!of,txt:'Mandato registrado hasta '+e+(of?'':'; la nómina no confirma si fue reelecto/a')};
  return{v:1,sinConf:false,txt:e===y?'Mandato registrado hasta '+e+' (fecha exacta no registrada)':'Mandato registrado hasta '+e}}
 if(of)return{v:1,sinConf:false,txt:'En ejercicio según fuente oficial (sin fecha de fin registrada)'};
 return{v:null,sinConf:false,txt:'Sin dato de vigencia en la nómina'}}
function mkCargo(p,hoy){
 const [inst,jur,niv]=INST[p.chamber]||[p.chamber||'—','—',''];
 const lugar=p.chamber==='Ejecutivo'?'':(p.department||p.distrito||'');
 let t=limpiaRol(p.cargo||p.role||'');if(lugar&&!fold(t).includes(fold(lugar)))t+=' por '+lugar;
 return Object.assign({id:p.id,p,inst,jur,niv,titulo:t,lugar,desde:p.term_start||null,hasta:p.term_end||null,nota:notaRol(p.role),bloque:p.bloque},vigDe(p,hoy))}
const evDe=c=>{const e=(campo,valor,calc)=>({campo,valor,calc,fuente:'data/politicians.json · fila '+c.id,url:c.p.source_url});const l=[e('cargo',c.titulo)];if(c.desde)l.push(e('desde',c.desde));if(c.hasta)l.push(e('hasta',c.hasta));if(c.bloque)l.push(e('bloque',c.bloque));if(c.p.verificado_en)l.push(e('verificado',c.p.verificado_en));l.push(e('vigencia',c.txt,true));return l};
const rk=c=>c.v===1?(c.hasta?1:0):(c.v===null?2:3);
const cmpC=(a,b)=>rk(a)-rk(b)||((anio(b.hasta)||0)-(anio(a.hasta)||0));
function mkPersona(cs,extra){const prim=cs[0];
 const v=cs.some(c=>c.v===1)?1:(cs.every(c=>c.v===0)?0:null);
 return Object.assign({id:prim.id,ids:cs.map(c=>c.id),nombre:prim.p.name,cargos:cs,v,sinConf:v===0&&cs.every(c=>c.sinConf),inst:prim.inst,jur:prim.jur,niv:prim.niv,cargo:prim.titulo,
  aliases:[...new Set(cs.flatMap(c=>c.p.aliases||[]))],fusion:cs.slice(1).map(c=>Object.assign({id:c.id},c.fus)),homonimos:[],ev:cs.flatMap(evDe)},extra||{})}
function build(){
 const hoy=new Date(),RES=S.res||{},nf=RES.no_fusionar||[],fu=RES.fusionar||[];
 personas=[];byId={};homonimos=[];
 const grupos={};S.pol.forEach(p=>{const c=mkCargo(p,hoy);(grupos[fold(p.name)]=grupos[fold(p.name)]||[]).push(c)});
 Object.values(grupos).forEach(g=>{
  g.sort(cmpC);const prim=g[0],miembros=[prim],aparte=[];
  g.slice(1).forEach(c=>{
   if(nf.some(x=>x.includes(c.id)&&x.includes(prim.id))){aparte.push([c,'marcada como persona distinta en data/resoluciones.json']);return}
   const f=fu.find(x=>(x.ids||[]).includes(c.id)&&(x.ids||[]).includes(prim.id));
   if(f){c.fus={conf:'confirmado por una persona',base:f.motivo||'indicado en data/resoluciones.json'};miembros.push(c);return}
   const nTok=fold(c.p.name).split(/\s+/).filter(Boolean).length,dc=!!(prim.lugar&&c.lugar),mismo=dc&&fold(prim.lugar)===fold(c.lugar);
   let no='';
   if(nTok<3)no='el nombre tiene menos de 3 palabras: podría ser un homónimo';
   else if(!(c.v===0&&prim.v!==0))no='los períodos no son sucesivos (el cargo anterior debe estar vencido y el otro no)';
   else if(dc&&!mismo)no='los departamentos son distintos ('+c.lugar+' / '+prim.lugar+')';
   if(no){aparte.push([c,no]);return}
   c.fus={conf:mismo?'confianza alta':'confianza media',base:'mismo nombre completo ('+nTok+' palabras)'+(mismo?' y mismo departamento ('+prim.lugar+')':'; una de las filas no indica departamento')+'. El cargo «'+c.titulo+'» figura vencido ('+(c.hasta||'sin año')+') y «'+prim.titulo+'» es posterior. Es un criterio de coincidencia, no una verificación de identidad.'};
   miembros.push(c)});
  const P=mkPersona(miembros);personas.push(P);
  aparte.forEach(([c,no])=>{const Q=mkPersona([c],{homonimoDe:P.id,motivo:no});P.homonimos.push({id:c.id,motivo:no});personas.push(Q);homonimos.push(Q)})});
 personas.sort((a,b)=>fold(a.nombre).localeCompare(fold(b.nombre)));
 personas.forEach(p=>p.ids.forEach(i=>byId[i]=p));
 NOMTOK=new Set();personas.forEach(p=>[p.nombre,...p.aliases].forEach(n=>fold(n).split(/[^a-z0-9]+/).forEach(w=>w&&NOMTOK.add(w))));
 (S.men||[]).concat(S.news||[]).forEach(m=>fold(m.source).split(/[^a-z0-9]+/).forEach(w=>w&&NOMTOK.add(w)));
 /* menciones: una sola vez por persona y nota (si dos filas de la nómina son la misma persona) */
 CTRL={menHuerf:0,menDup:0,menSinFecha:0};const seen={},tmp=[];
 (S.men||[]).forEach(m=>{const pe=byId[m.politician_id];if(!pe){CTRL.menHuerf++;return}

function tokensTitulo(m){let t=String(m.title||'');const i=t.lastIndexOf(' - ');if(i>10)t=t.slice(0,i);

 for(let i=n-1;i>=0;i--){const d=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()-i),e={k:dkey(d),total:0,score:0};dias.push(e);mapa[e.k]=e}

 if(fallo&&!Object.keys(nuevo).length)throw new Error('sin datos');
 const sgP=pols=>(pols||[]).map(p=>p.id+':'+p.vigencia).join(),prev={men:MEN.length,of:((S.of||{}).items||[]).length,news:(S.news||[]).length,gen:GEN&&+GEN,nom:sgP(S.pol)};
 Object.assign(S,nuevo);S.polById={};S.pol.forEach(p=>S.polById[p.id]=p);build();DIA=dkey(new Date());
 GEN=pd(S.agg&&S.agg.generated_at);updTxt();FAIL.length=0;
 const st=capturar();KEEP=true;await route();setTimeout(()=>restaurar(st),0);
 const d=[];const dm=MEN.length-prev.men,dof=((S.of||{}).items||[]).length-prev.of,dn=(S.news||[]).length-prev.news;
 const pl=(n,a,b)=>'+'+n+' '+(n===1?a:b);if(dm>0)d.push(pl(dm,'mención','menciones'));if(dof>0)d.push(pl(dof,'publicación oficial','publicaciones oficiales'));if(dn>0&&nuevo.news)d.push(pl(dn,'noticia','noticias'));if(nuevo.pol&&sgP(S.pol)!==prev.nom)d.push('nómina de legisladores actualizada');
 aviso(d.length?'Datos actualizados: '+d.join(', ')+'.':(force?'Datos verificados: no hay novedades.':'Datos actualizados.'))}
async function verificar(force){
 if(LIVE.busy||window.NEWAR_EMBED)return;LIVE.busy=true;pintaLive(true);
 try{const sg=await firma();LIVE.lastOk=Date.now();LIVE.ok=true;const cambio=LIVE.sig!==null&&sg!==LIVE.sig;LIVE.sig=sg;
  if(force||cambio)await recargar(force)}
 catch(e){LIVE.ok=false;if(force)aviso('No se pudo conectar. Se reintenta automáticamente.')}
 LIVE.last=Date.now();LIVE.busy=false;pintaLive()}
function pintaLive(chk){const e=$('#live');if(!e)return;
 if(window.NEWAR_EMBED){e.innerHTML='<span class="dot r"></span>Versión sin conexión (foto fija)';return}
 const h=GEN?(Date.now()-GEN)/36e5:null;let c='g';if(!LIVE.ok||h==null||h>36)c='r';else if(h>6)c='a';
 const et=!LIVE.ok?'Sin conexión':(h!=null&&h<=6?'En vivo':'Conectado');
 e.innerHTML=`<span class="dot ${c}" title="Verde: datos de las últimas 6 h · Ámbar: hasta 36 h · Rojo: más de 36 h o sin conexión"></span>${et} · ${chk?'verificando…':(LIVE.lastOk?'verificado '+esc(rel(LIVE.lastOk)):'verificando…')}`}
function pulso(){document.querySelectorAll('time.rel').forEach(e=>{e.textContent=rel(+e.dataset.ts)});pintaLive();
 if(personas.length&&DIA&&dkey(new Date())!==DIA){DIA=dkey(new Date());build();const st=capturar();KEEP=true;route().then(()=>setTimeout(()=>restaurar(st),0))}}
function arrancaVivo(){if(window.NEWAR_EMBED){pintaLive();return}
 DIA=dkey(new Date());firma().then(s=>{LIVE.sig=s;LIVE.lastOk=Date.now();LIVE.ok=true;pintaLive()}).catch(()=>{LIVE.ok=false;pintaLive()});
 setInterval(()=>{if(!document.hidden)verificar(false)},LIVE.every);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-LIVE.last>30000)verificar(false)});
 window.addEventListener('online',()=>verificar(false));
 const b=$('#lvb');if(b)b.addEventListener('click',()=>verificar(true))}

/* ---------- Router ---------- */
const TABS=[['inicio','Inicio'],['personas','Personas'],['menciones','Menciones'],['temas','Temas'],['eventos','Eventos'],['resumen','Resumen'],['oficiales','Oficiales'],['destacados','Destacados'],['control','Control']];
const NEEDS={inicio:['top','ev'],personas:[],persona:['dos','of'],menciones:[],temas:['top','tm'],tema:['top','tm'],eventos:['ev'],resumen:['news'],oficiales:['of','ofst'],destacados:[],control:['top','ev','news','of','ofst','dos','tm','nomst']};
const SITIO='https://nexxusconsultora-lab.github.io/salta-monitor/';
let firstRoute=true,rt=0;
async function route(){const my=++rt;const keep=KEEP;KEEP=false;const [v,arg]=(location.hash.replace(/^#\/?/,'')||'inicio').split('/');const name=V[v]?v:'inicio',id=arg?decodeURIComponent(arg):'';
 const tab=(name==='persona')?'personas':(name==='tema'?'temas':name);
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#/${k}" class="${k===tab?'on':''}"${k===tab?' aria-current="page"':''}>${l}</a>`).join('');
 const ns=NEEDS[name]||[];
 if(ns.some(k=>!(k in S))){$('#app').innerHTML='<p class="empty" role="status">Cargando datos…</p>';await need(...ns);if(my!==rt)return}
 const fr=GEN&&Date.now()-GEN>36*36e5?`<p class="warn" role="status"><b>Los datos no se actualizan desde ${esc(rel(GEN).replace('hace ',''))}.</b> La última corrida del recolector fue el ${esc(fdate(GEN))}. Lo que ves refleja esa fecha, no el día de hoy (por eso los gráficos de «últimos días» pueden estar vacíos). Revisá la pestaña <a href="#/control">Control</a>.</p>`:'';
 const aviso=fr+(!FAIL.length?'':(location.protocol==='file:'&&!window.NEWAR_EMBED
  ?`<p class="warn" role="alert"><b>Abriste NEWAR directamente desde un archivo.</b> Así el navegador bloquea la lectura de los datos. Entrá al sitio publicado: <a href="${esc(SITIO)}">${esc(SITIO)}</a>, o pedí la versión sin conexión (<code>newar-offline.html</code>).</p>`
  :`<p class="warn" role="alert">No se pudieron cargar estos datos: <code>${esc(FAIL.join(', '))}</code>. Lo que ves puede estar incompleto o vacío. Probá recargar la página.</p>`));
 $('#app').innerHTML=aviso+V[name](id);if(!keep)window.scrollTo(0,0);
 document.title='NEWAR — '+(name==='persona'&&byId[id]?byId[id].nombre:(TABS.find(t=>t[0]===tab)||[0,'Inicio'])[1]);
 const h=$('#app h2');if(!firstRoute&&h&&!keep){h.tabIndex=-1;h.focus({preventScroll:true})}firstRoute=false}

/* Reloj: hora actual del dispositivo, actualizada cada minuto (alineada al cambio de minuto) */
function updTxt(){const e=$('#upd');if(!e||!GEN)return;e.textContent='Datos al '+fdate(GEN)+' · '+rel(GEN);e.style.color=Date.now()-GEN>36*36e5?'var(--negtx)':''}
function tick(){updTxt();if(typeof pulso==='function')pulso();const el=$('#clock');if(!el)return;const d=new Date();
 el.textContent=d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
 el.setAttribute('datetime',d.toISOString())}
function startClock(){tick();const w=60000-(Date.now()%60000)+50;setTimeout(()=>{tick();setInterval(tick,60000)},w)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
startClock();
$('#skip').addEventListener('click',()=>$('#app').focus());
window.addEventListener('hashchange',route);
(async()=>{
 await need('pol','agg','men','res');S.polById={};S.pol.forEach(p=>S.polById[p.id]=p);build();
 GEN=pd(S.agg&&S.agg.generated_at);updTxt();
 await route();arrancaVivo()})();
</script>
