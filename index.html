const S={};const SRC={res:['resoluciones',{},true],tm:['topic_mentions',[]],pol:['politicians',[]],agg:['aggregates',null],men:['mentions',[]],dos:['dossiers',{}],top:['topics_data',{topics:{}}],ev:['events',{events:[]}],news:['news_general',[]],of:['oficiales',{items:[]}],odd:['orden_del_dia',{items:[]},true],ofst:['oficiales_status',{sources:{}}],nomst:['nomina_status',{sources:{}},true],cur:['curriculums',{personas:{}},true],ind:['indec_salta',null,true],cen:['censo_salta',null,true]};

/* ---------- Modelo NEWAR: persona / cargo / evidencia. Todo se CALCULA con la fecha de hoy y los datos vigentes: nada fijo a mano ---------- */
const INST={'Ejecutivo':['Poder Ejecutivo de Salta','Provincia de Salta','provincial'],'Diputados':['Cámara de Diputados de Salta','Provincia de Salta','provincial'],'Senado':['Cámara de Senadores de Salta','Provincia de Salta','provincial'],'Concejo Deliberante':['Concejo Deliberante de la Ciudad de Salta','Municipio de la Ciudad de Salta','municipal'],'Diputados de la Nación':['Cámara de Diputados de la Nación','República Argentina','nacional'],'Senado de la Nación':['Cámara de Senadores de la Nación','República Argentina','nacional']};
let personas=[],byId={},homonimos=[],MEN=[],PM={},CTRL={},GEN=null,NOMTOK=new Set();
const pd=v=>{if(v==null||v==='')return null;const d=new Date(v);return isNaN(d)?null:d};
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const anio=v=>{const n=parseInt(String(v==null?'':v).slice(0,4),10);return isNaN(n)?null:n};
const esOficial=u=>/^https?:\/\/([a-z0-9-]+\.)*(gob|gov)\.ar(\/|$)/i.test(u||'');
const limpiaRol=r=>String(r||'').replace(/\s*\((mandato|periodo)[^)]*\)/i,'').replace(/\s*[—-]\s*mandato vigente en [a-záéíóú]+ de \d{4}/i,'').replace(/\s*\(Concejo Deliberante\)/i,'').trim();

/* Vigencia = f(período registrado, tipo de fuente, fecha de HOY). Nunca se lee de un campo escrito a mano. */
function vigDe(p,hoy){
 const R=((S.res||{}).periodos||{})[p.id];
 if(R&&typeof R.vigente==='boolean')return{v:R.vigente?1:0,sinConf:false,txt:'Confirmado por una persona'+(R.fuente?' ('+R.fuente+')':'')};
 /* Nómina oficial: el recolector (scripts/nomina.py) lee el sitio oficial y deja vigencia + verificado_en. Se usa solo si la fila trae fecha de verificación; "vigente" además exige fuente oficial. */
 const vf=p.verificado_en?fdate(p.verificado_en,{dateStyle:'medium'}):'';
 if(vf&&p.vigencia==='ex'){const xd=p.ex_desde?fdate(p.ex_desde,{dateStyle:'medium'}):'';return{v:0,sinConf:false,txt:'Ya no figura en la nómina oficial'+(xd?' (el recolector lo detectó el '+xd+')':'')+'; verificado el '+vf}}
 if(vf&&p.vigencia==='vigente'&&esOficial(p.source_url)){const e0=anio(p.term_end),y0=hoy.getFullYear();return{v:1,sinConf:false,txt:'Figura en la nómina oficial (verificado el '+vf+')'+(e0!=null&&e0<y0?'. El período registrado ('+e0+') está desactualizado: manda la nómina oficial':'')}}
 const y=hoy.getFullYear(),s=anio(p.term_start),e=anio(p.term_end),of=esOficial(p.source_url);
 if(s!=null&&s>y)return{v:null,sinConf:false,txt:'El período registrado empieza recién en '+s};
 if(e!=null){
  if(e<y)return{v:0,sinConf:!of,txt:'Mandato registrado hasta '+e+(of?'':'; la nómina no confirma si fue reelecto/a')};
  return{v:1,sinConf:false,txt:e===y?'Mandato registrado hasta '+e+' (fecha exacta no registrada)':'Mandato registrado hasta '+e}}
 if(of)return{v:1,sinConf:false,txt:'En ejercicio según fuente oficial (sin fecha de fin registrada)'};
 return{v:null,sinConf:false,txt:'Sin dato de vigencia en la nómina'}}
function mkCargo(p,hoy){
 const [inst,jur,niv]=INST[p.chamber]||[p.chamber||'—','—',''];
 const lugar=p.chamber==='Ejecutivo'?'':(p.department||p.distrito||'');
 let t=limpiaRol(p.cargo||p.role||'');if(lugar&&!fold(t).includes(fold(lugar)))t+=' por '+lugar;
 return Object.assign({id:p.id,p,inst,jur,niv,titulo:t,lugar,desde:p.term_start||null,hasta:p.term_end||null,nota:notaRol(p.role),bloque:p.bloque},vigDe(p,hoy))}
const evDe=c=>{const e=(campo,valor,calc)=>({campo,valor,calc,fuente:'data/politicians.json · fila '+c.id,url:c.p.source_url});const l=[e('cargo',c.titulo)];if(c.desde)l.push(e('desde',c.desde));if(c.hasta)l.push(e('hasta',c.hasta));if(c.bloque)l.push(e('bloque',c.bloque));if(c.p.verificado_en)l.push(e('verificado',c.p.verificado_en));l.push(e('vigencia',c.txt,true));return l};
const rk=c=>c.v===1?(c.hasta?1:0):(c.v===null?2:3);

function mkPersona(cs,extra){const prim=cs[0];

 return Object.assign({id:prim.id,ids:cs.map(c=>c.id),nombre:prim.p.name,cargos:cs,v,sinConf:v===0&&cs.every(c=>c.sinConf),inst:prim.inst,jur:prim.jur,niv:prim.niv,cargo:prim.titulo,
  aliases:[...new Set(cs.flatMap(c=>c.p.aliases||[]))],fusion:cs.slice(1).map(c=>Object.assign({id:c.id},c.fus)),homonimos:[],ev:cs.flatMap(evDe)},extra||{})}
function build(){
 const hoy=new Date(),RES=S.res||{},nf=RES.no_fusionar||[],fu=RES.fusionar||[];
 personas=[];byId={};homonimos=[];
 const grupos={};S.pol.forEach(p=>{const c=mkCargo(p,hoy);(grupos[fold(p.name)]=grupos[fold(p.name)]||[]).push(c)});
 Object.values(grupos).forEach(g=>{
  g.sort(cmpC);const prim=g[0],miembros=[prim],aparte=[];
  g.slice(1).forEach(c=>{
   if(nf.some(x=>x.includes(c.id)&&x.includes(prim.id))){aparte.push([c,'marcada como persona distinta en data/resoluciones.json']);return}
   const f=fu.find(x=>(x.ids||[]).includes(c.id)&&(x.ids||[]).includes(prim.id));
   if(f){c.fus={conf:'confirmado por una persona',base:f.motivo||'indicado en data/resoluciones.json'};miembros.push(c);return}
   const nTok=fold(c.p.name).split(/\s+/).filter(Boolean).length,dc=!!(prim.lugar&&c.lugar),mismo=dc&&fold(prim.lugar)===fold(c.lugar);
   let no='';
   if(nTok<3)no='el nombre tiene menos de 3 palabras: podría ser un homónimo';
   else if(!(c.v===0&&prim.v!==0))no='los períodos no son sucesivos (el cargo anterior debe estar vencido y el otro no)';
   else if(dc&&!mismo)no='los departamentos son distintos ('+c.lugar+' / '+prim.lugar+')';
   if(no){aparte.push([c,no]);return}
   c.fus={conf:mismo?'confianza alta':'confianza media',base:'mismo nombre completo ('+nTok+' palabras)'+(mismo?' y mismo departamento ('+prim.lugar+')':'; una de las filas no indica departamento')+'. El cargo «'+c.titulo+'» figura vencido ('+(c.hasta||'sin año')+') y «'+prim.titulo+'» es posterior. Es un criterio de coincidencia, no una verificación de identidad.'};
   miembros.push(c)});
  const P=mkPersona(miembros);personas.push(P);
  aparte.forEach(([c,no])=>{const Q=mkPersona([c],{homonimoDe:P.id,motivo:no});P.homonimos.push({id:c.id,motivo:no});personas.push(Q);homonimos.push(Q)})});
 personas.sort((a,b)=>fold(a.nombre).localeCompare(fold(b.nombre)));
 personas.forEach(p=>p.ids.forEach(i=>byId[i]=p));
 NOMTOK=new Set();personas.forEach(p=>[p.nombre,...p.aliases].forEach(n=>fold(n).split(/[^a-z0-9]+/).forEach(w=>w&&NOMTOK.add(w))));
 (S.men||[]).concat(S.news||[]).forEach(m=>fold(m.source).split(/[^a-z0-9]+/).forEach(w=>w&&NOMTOK.add(w)));
 /* menciones: una sola vez por persona y nota (si dos filas de la nómina son la misma persona) */
 CTRL={menHuerf:0,menDup:0,menSinFecha:0};const seen={},tmp=[];
 (S.men||[]).forEach(m=>{const pe=byId[m.politician_id];if(!pe){CTRL.menHuerf++;return}
  const k=pe.id+'|'+(m.link||m.id);if(seen[k]){CTRL.menDup++;return}seen[k]=1;
  const d=pd(m.published_iso||m.published);if(!d)CTRL.menSinFecha++;tmp.push(Object.assign({},m,{_pid:pe.id,_d:d}))});
 tmp.sort((a,b)=>(b._d||0)-(a._d||0));MEN=tmp;PM={};MEN.forEach(m=>(PM[m._pid]=PM[m._pid]||[]).push(m))}
const badgeV=(v,sc)=>v===1?'<span class="tag vigente">vigente</span>':v===0?(sc?'<span class="tag warnc" title="Según el registro el mandato terminó, pero la nómina no confirma si fue reelecto/a">mandato vencido · sin confirmar</span>':'<span class="tag no-vigente">no vigente</span>'):'<span class="tag">vigencia sin dato</span>';
const licTag=p=>p&&p.licencia?'<span class="tag warnc" title="'+esc(p.licencia_nota||'De licencia')+'">de licencia</span>':'';
const badge=p=>badgeV(p.v,p.sinConf)+(p.cargos&&p.cargos.some(c=>c.p&&c.p.licencia)?licTag({licencia:1,licencia_nota:(p.cargos.find(c=>c.p&&c.p.licencia).p.licencia_nota)}):'');
const total=id=>{const p=byId[id];return p?(PM[p.id]||[]).length:0};
/* ---- Cálculos sobre menciones (no se usan by_day/sentiment_by_day del agregado: traen fechas truncadas y sin año) ---- */
const STOP=new Set(('para con por una uno unos unas del los las que como mas pero sus fue son era ser han hay este esta estos estas ese esa esos esas sobre entre desde hasta tras ante bajo cada todo toda todos todas otro otra otros otras muy sin segun tambien donde cuando quien quienes cual cuales tiene tienen tener hace hacer hizo dijo dice dicen dio dar quedo quedan sera seran sido estan estar estaba nuevo nueva nuevos nuevas primer primera primero anos dias hoy ayer manana semana mes meses vez veces gran ademas aunque luego ahora aqui alli asi puede pueden podria podran debe deben dos tres cuatro cinco seis siete ocho nueve diez mil millones video fotos foto vivo salta provincia provincial senado senador senadores senadora diputado diputados diputada camara concejal concejales legislatura gobernador politica noticia noticias enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre contra nacional provincial provinciales pueblo capital buscan pidio aprobo abandona').split(' '));
function tokensTitulo(m){let t=String(m.title||'');const i=t.lastIndexOf(' - ');if(i>10)t=t.slice(0,i);
 return[...new Set(fold(t).split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!/^\d+$/.test(w)&&!STOP.has(w)&&!NOMTOK.has(w)))]}
function terminos(list,n){const c={};list.forEach(m=>tokensTitulo(m).forEach(w=>c[w]=(c[w]||0)+1));return Object.entries(c).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,n).map(([term,count])=>({term,count}))}
function cruces(){const g={};MEN.forEach(m=>{(g[m.link]=g[m.link]||new Set()).add(m._pid)});const c={};
 Object.values(g).forEach(s=>{const a=[...s].sort();for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const k=a[i]+'|'+a[j];c[k]=(c[k]||0)+1}});
 return Object.entries(c).map(([k,n])=>{const[a,b]=k.split('|');return{a:byId[a].nombre,b:byId[b].nombre,count:n}}).sort((x,y)=>y.count-x.count).slice(0,10)}
function serie(items,n){const hoy=new Date(),dias=[],mapa={};
 for(let i=n-1;i>=0;i--){const d=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()-i),e={k:dkey(d),total:0,score:0};dias.push(e);mapa[e.k]=e}
 let ult=null;items.forEach(m=>{const d=m._d||pd(m.published_iso||m.published);if(!d)return;if(!ult||d>ult)ult=d;const e=mapa[dkey(d)];if(e){e.total++;e.score+=(+m.sentiment_score||0)}});
 return{dias,ult,n:dias.reduce((s,d)=>s+d.total,0)}}
const conteo=l=>({positivo:l.filter(m=>m.sentiment_label==='positivo').length,negativo:l.filter(m=>m.sentiment_label==='negativo').length,neutral:l.filter(m=>m.sentiment_label==='neutral').length});
const uniq=(l,f)=>{const s=new Set();return l.filter(x=>{const k=f(x);if(s.has(k))return false;s.add(k);return true})};

/* ---------- Piezas reutilizables ---------- */
const boxes=(t,b)=>`<div class="boxes"><div class="box"><b>${t}</b><span>Menciones</span></div><div class="box"><b>${b.positivo}</b><span>Positivas</span></div><div class="box"><b>${b.negativo}</b><span>Negativas</span></div><div class="box"><b>${b.neutral}</b><span>Neutras</span></div></div>`;
function toneBars(items,n=45){const s=serie(items,n);

V.cruce=()=>{const pe=Object.entries(PM).map(([id,l])=>[byId[id],l.filter(okPrec)]).filter(x=>x[0]&&x[1].length).sort((a,b)=>b[1].length-a[1].length).slice(0,15);
 const ws=terminos(pe.flatMap(x=>x[1]),14).map(t=>t.term);
 if(!pe.length||!ws.length)return'<h2 class="sec">Cruce</h2><p class="empty">Todavía no hay menciones suficientes para armar el cruce.</p>';
 const fil=pe.map(([p,l])=>{const tk=l.map(m=>new Set(tokensTitulo(m)));return[p,ws.map(w=>tk.filter(x=>x.has(w)).length)]});
 const mx=Math.max(1,...fil.flatMap(r=>r[1]));
 return`<h2 class="sec">Cruce: palabras y funcionarios</h2><p class="lede">Cada celda cuenta las notas de esa persona cuyo título usa esa palabra. Las 15 personas con más menciones contra las 14 palabras más repetidas entre ellas. Tocá una celda para ver las notas.</p>${precSel()}<div class="hmw"><table class="hm"><thead><tr><th>Persona</th>${ws.map(w=>`<th><a href="#/palabra/${encodeURIComponent(w)}">${esc(w)}</a></th>`).join('')}</tr></thead><tbody>${fil.map(([p,c])=>`<tr><td><a href="#/persona/${encodeURIComponent(p.id)}">${esc(p.nombre)}</a></td>${c.map((n,i)=>n?`<td style="background:color-mix(in srgb,var(--indigo) ${Math.round(n/mx*70)}%,transparent)"><a href="#/palabra/${encodeURIComponent(ws[i])}/${encodeURIComponent(p.id)}">${n}</a></td>`:'<td></td>').join('')}</tr>`).join('')}</tbody></table></div><p class="note">Es coincidencia de texto en los títulos: que una persona aparezca junto a una palabra no significa que haya dicho o hecho algo vinculado a ella.</p>`};
V.temas=()=>{const l=Object.values(S.top.topics||{}).filter(t=>!esPlaceholder(t));return`<h2 class="sec">Temas seguidos</h2><p class="lede">Además de personas, se siguen temas puntuales (una obra, un presupuesto, una causa). Se configuran en <code>data/topics.json</code>; los registros de ejemplo no se muestran.</p>${l.length?l.map(t=>{const it=temaItems(t.id),c=conteo(it);return`<a class="row2" href="#/tema/${encodeURIComponent(t.id)}"><span class="nm">${esc(t.name)}<br><span class="meta">${c.positivo} positivas · ${c.negativo} negativas · ${(t.politicians_involved||[]).length} personas involucradas</span></span><span class="meta">${it.length} menciones</span></a>`}).join(''):'<p class="empty">No hay temas configurados todavía.</p>'}`};
const temaItems=id=>uniq((S.tm||[]).filter(x=>x.topic_id===id).map(x=>Object.assign({},x,{_d:pd(x.published)})),x=>x.link).sort((a,b)=>(b._d||0)-(a._d||0));

 const qs=uniq(it.filter(m=>m.quote),m=>m.quote).slice(0,15).map(m=>({quote:m.quote,source:m.source,link:m.link,date:m.published}));

V.eventos=()=>{const l=S.ev.events||[];return`<h2 class="sec">Eventos conectados</h2><p class="lede">Noticias de distintas fuentes que probablemente hablan del mismo hecho (ventana de 72 h, por palabras compartidas en el título). <b>Es agrupamiento por texto, no comprensión del contenido</b>: puede juntar notas sin relación.</p>${l.length?l.map(e=>`<div class="pnl"><h3 style="margin:.1rem 0 .5rem">${esc(e.title)}</h3><div><span class="pill">${e.items_count} notas</span><span class="pill">${e.sources.length} medios: ${esc(e.sources.join(', '))}</span>${e.politicians.map(p=>`<span class="pill pol">${esc(p)}</span>`).join('')}${e.topics.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><ul>${e.items.map(i=>`<li><a href="${esc(safe(i.link))}" target="_blank" rel="noopener">${esc(i.title)}</a> — ${esc(i.source)} · ${fpub(i.date)}</li>`).join('')}</ul></div>`).join(''):'<p class="empty">Todavía no se detectaron eventos con varias fuentes.</p>'}`};

V.resumen=()=>{setTimeout(()=>{let h=12,N=150;const go=()=>{const cat=$('#rc').value,cut=Date.now()-h*36e5;

 document.querySelectorAll('#rb button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#rb button').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});b.classList.add('on');b.setAttribute('aria-pressed','true');h=+b.dataset.h;N=150;go()});$('#rc').oninput=go;go()});

/* ---------- Sesiones: documentos de orden del día / plan de labor / temario de las 4 cámaras (data/orden_del_dia.json) ---------- */
const SESMES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
const sesTitulo=d=>{let t=String(d.titulo||'').trim();if(!t||/^download$/i.test(t)){try{const f=decodeURIComponent(String(d.url||'').replace(/[?#].*$/,'').replace(/\/download$/,'').split('/').pop()).replace(/\.pdf$/i,'').replace(/[_+]+/g,' ').replace(/\s+/g,' ').trim();if(f)t=f}catch(e){}}return t||'(sin título)'};
const sesFecha=d=>{const t=sesTitulo(d)+' '+String(d.url||'')+' '+String(d.fecha_mencionada||'');let m=t.match(/(\d{1,2})[\/-](\d{1,2})[\/-](20\d{2})/),da,mo,y;
 if(m){da=+m[1];mo=+m[2];y=+m[3]}else{m=fold(t).match(/(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)/);if(m){da=+m[1];mo=SESMES[m[2]];y=anio(d.first_seen)}}
 if(!y||mo<1||mo>12||da<1||da>31)return null;const f=new Date(y,mo-1,da);return isNaN(f)?null:f};
const SES={cam:'',tem:0,q:''};
const sesCard=d=>{const f=d._f,hoy=new Date();hoy.setHours(0,0,0,0);const cuando=f?(f>=hoy?'<span class="tag vigente">próxima · '+esc(fdate(f,{dateStyle:'medium'}))+'</span>':'<span class="tag">sesión del '+esc(fdate(f,{dateStyle:'medium'}))+'</span>'):'<span class="tag">sin fecha de sesión registrada</span>';
 const tm=(d.temas||[]).map(t=>`<a class="pill" href="#/palabra/${encodeURIComponent(t)}">${esc(t)}</a>`).join(' '),ag=d.agenda||[],ds=d.destacados||[];
 let blq;
 if(d.agenda_v){
  blq=(ds.length?`<h4 class="sh">Temas destacados del orden del día</h4><ol class="sesd">${ds.map(x=>`<li><span class="tag ind">${esc(x.tipo)}</span> ${esc(x.t)}${(x.temas||[]).length?' '+x.temas.map(t=>`<a class="pill" href="#/palabra/${encodeURIComponent(t)}">${esc(t)}</a>`).join(' '):''}</li>`).join('')}</ol>`:'<p class="meta">Se leyó el documento pero no se pudieron identificar ítems numerados del orden del día.</p>')
   +(ag.length>ds.length?`<details><summary class="meta">Orden del día completo (${ag.length} ítems leídos)</summary><ol class="sesd">${ag.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`:'')
   +(tm?`<p class="meta">Temas vigilados que aparecen en el texto: ${tm}</p>`:'')
   +((d.personas||[]).length?`<p class="meta">Nombra a: ${(d.personas||[]).map(esc).join(', ')}</p>`:'')
   +(!ag.length&&d.extracto?`<details><summary class="meta">Primeras líneas del documento</summary><p class="meta" style="white-space:pre-wrap">${esc(d.extracto)}</p></details>`:'');
 }else blq='<p class="meta">Todavía no se leyó el texto de este documento: abrí el enlace para ver qué se trata.</p>';
 return`<article class="art"><div style="min-width:0"><div class="meta"><span class="tag ind">${esc(d.camara_nombre||d.camara)}</span> ${cuando} · publicado ${esc(fdate(d.first_seen,{dateStyle:'medium'}))}</div><p class="t"><a href="${esc(safe(d.url))}" target="_blank" rel="noopener noreferrer">${esc(sesTitulo(d))}</a></p>${blq}</div></article>`};
V.sesiones=()=>{const it=(S.odd&&S.odd.items)||[],hoy=new Date();hoy.setHours(0,0,0,0);
 const L=it.filter(d=>d&&d.url).map(d=>Object.assign({},d,{_f:sesFecha(d)})).filter(d=>!/^(\d{4})$/.test(sesTitulo(d))||d.texto_leido);
 const cams=[...new Set(L.map(d=>d.camara_nombre||d.camara))].sort((a,b)=>a.localeCompare(b,'es'));
 setTimeout(()=>{const go=()=>{SES.cam=$('#sc').value;SES.tem=$('#st').checked?1:0;SES.q=fold($('#sq').value.trim());
  const l=L.filter(d=>(!SES.cam||(d.camara_nombre||d.camara)===SES.cam)&&(!SES.tem||(d.temas||[]).length)&&(!SES.q||fold(sesTitulo(d)+' '+(d.extracto||'')+' '+(d.temas||[]).join(' ')).includes(SES.q)));
  const prox=l.filter(d=>d._f&&d._f>=hoy).sort((a,b)=>a._f-b._f),pas=l.filter(d=>d._f&&d._f<hoy).sort((a,b)=>b._f-a._f),sin=l.filter(d=>!d._f).sort((a,b)=>String(b.first_seen).localeCompare(String(a.first_seen)));
  $('#sn').textContent=prox.length+' próximas · '+pas.length+' pasadas · '+sin.length+' sin fecha de sesión';
  const ct={};prox.filter(d=>d.agenda_v).forEach(d=>(d.temas||[]).forEach(t=>{ct[t]=(ct[t]||0)+1}));const tt=Object.entries(ct).sort((a,b)=>b[1]-a[1]);
  $('#sd').innerHTML=tt.length?'<p class="note"><b>Temas vigilados en las próximas sesiones:</b> '+tt.map(([t,n])=>`<a class="pill" href="#/palabra/${encodeURIComponent(t)}">${esc(t)} · ${n}</a>`).join(' ')+'. Tocá uno para ver qué personas aparecen en la prensa con esa palabra.</p>':'';
  $('#sp').innerHTML=prox.length?'':'<p class="empty">No hay documentos de sesiones próximas con estos filtros. Si hoy hay sesión y no aparece, la cámara todavía no publicó su orden del día o plan de labor.</p>';
  if(prox.length)pager($('#sp'),prox,sesCard,50);pager($('#sr'),pas.concat(sin),sesCard,30)};
  ['sc','st','sq'].forEach(i=>$('#'+i).addEventListener('input',go));go()});
 return`<h2 class="sec">Sesiones: qué se va a tratar</h2><p class="lede">Documentos que las cámaras publican antes de sesionar (orden del día, plan de labor, temario): Diputados y Senado de la Nación, y Diputados y Senado de Salta. Cada uno lleva el enlace al original, que es la fuente. Los <b>temas destacados</b> son ítems del orden del día leídos del documento, ordenados así: primero los que tocan una palabra vigilada (se editan en data/fuentes_orden_del_dia.json), después proyectos de ley, resoluciones, declaraciones y homenajes. Es una lectura automática del texto: el documento original manda.</p>
 <div class="ctl"><select id="sc" aria-label="Cámara"><option value="">Las 4 cámaras</option>${cams.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input type="search" id="sq" placeholder="Buscar en títulos y texto…" aria-label="Buscar en sesiones" autocomplete="off"><label class="chk"><input type="checkbox" id="st"> Solo los que tocan un tema vigilado</label></div><p class="note" id="sn"></p>
 <div id="sd"></div><h3 class="sh">Próximas sesiones</h3><div id="sp"></div><h3 class="sh">Anteriores y sin fecha</h3><div id="sr"></div>
 ${L.length?'':'<p class="empty">Todavía no hay documentos guardados. Los carga el recolector «Orden del día» (Actions).</p>'}<p class="note">Limitaciones: solo se ve lo que la cámara publica como documento legible; un PDF escaneado se muestra sin texto, y una sesión sin documento publicado no aparece.</p>`};
V.oficiales=()=>{const it=S.of.items||[];const opt=k=>[...new Set(it.map(i=>i[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')).map(v=>`<option>${esc(v)}</option>`).join('');
 setTimeout(()=>{const go=()=>{const f=$('#of').value,t=$('#ot').value,q=fold($('#oq').value.trim()),pp=$('#op').checked;
  const l=it.filter(i=>(!f||i.fuente===f)&&(!t||i.tipo_acto===t)&&(!pp||(i.personas||[]).length)&&(!q||fold((i.titulo||'')+(i.resumen||'')+(i.organismo||'')).includes(q)))
   .map((i,x)=>[i,x]).sort((a,b)=>((b[0].fecha_publicacion||(b[0].first_seen||'').slice(0,10))).localeCompare(a[0].fecha_publicacion||(a[0].first_seen||'').slice(0,10))||a[1]-b[1]).map(x=>x[0]);

 <h2 class="sec">Estado de las fuentes</h2>${st.length?st.map(s=>`<div class="row2"><span><span class="tag ${s.state==='ok'?'vigente':'negativo'}">${esc(s.state)}</span> <b>${esc(s.name)}</b><br><span class="meta">${esc(s.message)} · <a href="${esc(safe(s.url))}" target="_blank" rel="noopener">abrir la fuente</a></span></span></div>`).join(''):'<p class="empty">Todavía no corrió el recolector.</p>'}`};

V.control=()=>{
 const hoy=new Date(),L=[],add=(e,t,d)=>L.push([e,t,d||'']);
 const TG={ok:'<span class="tag vigente">ok</span>',av:'<span class="tag warnc">revisar</span>',er:'<span class="tag negativo">problema</span>'};
 const edad=d=>d?(hoy-d)/36e5:null,txtEdad=h=>h==null?'sin fecha':h<48?Math.round(h)+' h':Math.round(h/24)+' días';
 [['aggregates.json',S.agg&&S.agg.generated_at],['events.json',S.ev&&S.ev.generated_at],['oficiales.json',S.of&&S.of.generated_at],['oficiales_status.json',S.ofst&&S.ofst.generated_at],['topics_data.json',S.top&&S.top.generated_at]].forEach(([n,g])=>{
  const d=pd(g),h=edad(d);add(h==null?'av':h>168?'er':h>36?'av':'ok','Frescura de '+n,d?'Generado el '+fdate(d)+' (hace '+txtEdad(h)+'). El recolector corre varias veces por día: más de 36 h sin cambios indica que dejó de actualizar.':'No trae fecha de generación.')});
 const cnt=(f)=>personas.filter(f).length,venc=cnt(p=>p.v===0&&p.sinConf),vig=cnt(p=>p.v===1),ex=cnt(p=>p.v===0&&!p.sinConf),sd=cnt(p=>p.v===null);
 add('ok','Vigencia calculada con la fecha de hoy',`${vig} vigentes · ${ex} no vigentes confirmados · ${venc} con mandato vencido sin confirmar · ${sd} sin dato. Se recalcula cada vez que se abre la página; no depende de un campo escrito a mano.`);
 if(venc){const rec=personas.filter(p=>p.v===0&&p.sinConf&&(PM[p.id]||[]).some(m=>m._d&&hoy-m._d<90*864e5)).length;
  add('av','Mandatos vencidos sin confirmar reelección',`${venc} personas figuran con un mandato que terminó según el registro (fuente no oficial). Con esa fuente no se puede saber si fueron reelectas. ${rec} de ellas tienen menciones en los últimos 90 días (es una señal de actividad, no una prueba de vigencia). Después de cada elección hay que actualizar <code>politicians.json</code> desde una fuente oficial, o confirmar caso por caso en <code>data/resoluciones.json</code> (<code>periodos</code>).`)}
