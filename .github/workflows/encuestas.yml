name: Encuestas de la prensa argentina

on:
  # Corre cuando cambia el script (así hay datos enseguida). Los archivos de datos no están a propósito: evita bucles.
  push:
    branches: [main]
    paths:
      - "scripts/encuestas.py"
      - "scripts/consultoras.py"
      - ".github/workflows/encuestas.yml"
  schedule:
    # Cada 3 horas (hora UTC de GitHub; puede demorar unos minutos si hay mucha carga).
    - cron: "35 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: encuestas-newar
  cancel-in-progress: false

jobs:
  encuestas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Instalar lector de RSS
        run: pip install feedparser

      - name: Buscar encuestas nuevas en la prensa
        run: python scripts/encuestas.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/encuestas.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de encuestas"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
