name: Autoridades del Senado - Salta

on:
  # Corre apenas subís o cambiás el script, una vez por día y a pedido
  # (botón "Run workflow" en la pestaña Actions).
  # No incluye data/autoridades.json a propósito: así el commit de datos
  # no vuelve a disparar este workflow en bucle.
  push:
    branches: [main]
    paths:
      - "scripts/actualizar_autoridades.py"
      - ".github/workflows/autoridades.yml"
  schedule:
    # Una vez por día, 09:50 UTC (06:50 de Argentina). Las autoridades de
    # cámara cambian una vez por año o menos, más seguido no aporta nada.
    - cron: "50 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: autoridades-salta
  cancel-in-progress: false

jobs:
  autoridades:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # No hay "pip install": el script usa solo lo que trae Python.
      # Si la página cambia de formato, el script no toca nada y lo avisa en
      # data/autoridades_status.json (no hace fallar el workflow).
      - name: Leer las autoridades del Senado desde el sitio oficial
        run: python scripts/actualizar_autoridades.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/autoridades.json data/autoridades_status.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de las autoridades del Senado"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
