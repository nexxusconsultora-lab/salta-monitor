name: Noticias electorales

on:
  # Corre cuando cambia el script (así hay datos enseguida). Los archivos de datos no están a propósito: evita bucles.
  push:
    branches: [main]
    paths:
      - "scripts/elecciones_noticias.py"
      - ".github/workflows/elecciones_noticias.yml"
  schedule:
    # Cada 10 minutos, desfasado respecto de la recolección de noticias (que corre cada 5): así siempre mira datos ya guardados.
    # Hora UTC de GitHub; puede demorar unos minutos si hay mucha carga.
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: elecciones-noticias-newar
  cancel-in-progress: false

jobs:
  noticias-electorales:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Separar las noticias y publicaciones oficiales sobre elecciones
        run: python scripts/elecciones_noticias.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/elecciones_noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de noticias electorales"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
