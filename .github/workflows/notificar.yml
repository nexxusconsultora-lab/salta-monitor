name: Notificar el resumen diario al celular

# Manda 4 ediciones por día SOLO a tu celular: 09:00 (resumen de ayer + lo de la madrugada), 12:00, 17:00 y 21:00 (lo nuevo).
# Los datos de entrega (tema de ntfy o bot de Telegram) viven en «Secrets» de GitHub: no están en el repo.
# Ver GUIA_NOTIFICACIONES.md para configurarlo en 5 minutos.
on:
  schedule:
    # Hora de Argentina = UTC-3. Cada corrida sale 15 minutos antes de la hora que querés, porque GitHub suele
    # demorar las corridas programadas (a veces más de 15 minutos): así el mensaje llega cerca de la hora indicada.
    # Para cambiar una hora, sumale 3 a la hora que quieras (en UTC) y restale 15 minutos.
    - cron: "45 11 * * *"   # 08:45 AR → edición de las 09:00 (resumen de ayer + madrugada)
    - cron: "45 14 * * *"   # 11:45 AR → edición de las 12:00
    - cron: "45 19 * * *"   # 16:45 AR → edición de las 17:00
    - cron: "45 23 * * *"   # 20:45 AR → edición de las 21:00
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar aunque esa edición ya se haya avisado (y sin descontar lo ya enviado)"
        type: boolean
        default: false
      edicion:
        description: "Qué mandar: auto = la que corresponde a esta hora; o elegí una"
        type: choice
        options: ["auto", "manana", "mediodia", "tarde", "noche"]
        default: "auto"

permissions:
  contents: write

concurrency:
  group: notificar-resumen
  cancel-in-progress: false

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Armar los resúmenes de ayer y de hoy
        run: python scripts/resumen_diario.py

      - name: Enviar la notificación
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORZAR: ${{ inputs.forzar }}
          EDICION: ${{ inputs.edicion }}
          HORARIO: ${{ github.event.schedule }}
        run: |
          ARGS=""
          if [ "$FORZAR" = "true" ]; then ARGS="--forzar"; fi
          # sin elegir edición, el script la decide por la hora de Argentina (aunque la corrida se demore)
          if [ -n "$EDICION" ] && [ "$EDICION" != "auto" ]; then ARGS="$ARGS --edicion $EDICION"; fi
          python scripts/notificar.py $ARGS

      - name: Guardar el registro de avisos
        if: always()
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add -A data/resumenes || true
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Registro de avisos y resumen diario"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
