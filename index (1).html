<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NEWAR — Personas, cargos, evidencia y prensa de Salta</title>
<link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Tipografías alojadas en el repositorio (licencia OFL, ver fonts/LICENSE-*.txt). Subset latin: cubre español completo. */
@font-face{font-family:Newsreader;font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/newsreader-latin-opsz-normal.woff2) format('woff2')}
@font-face{font-family:Newsreader;font-style:italic;font-weight:200 800;font-display:swap;src:url(fonts/newsreader-latin-opsz-italic.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}
:root{--paper:#F3EEE2;--raised:#FBF8F1;--ink:#211D1A;--soft:#5C554C;--line:#D9D1BF;--clay:#B1502E;--indigo:#2B3A55;--pos:#4C7A5D;--neg:#8B3A3A;--neu:#6F665A;--warn:#F6E7D8;--onind:#fff;--onclay:#fff;--negtx:#8B3A3A}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#211D1A;--raised:#2B2621;--ink:#F3EEE2;--soft:#B9B0A0;--line:#45403A;--clay:#D97A52;--indigo:#9DB1D8;--warn:#3a2c22;--onind:#211D1A;--onclay:#211D1A;--negtx:#E59A9A}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Newsreader,Georgia,serif}a{color:inherit}
code{background:var(--paper);border:1px solid var(--line);padding:0 .3rem;border-radius:2px;font-size:.85em}
nav.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--ink);padding:.7rem 1.25rem 0;padding-top:calc(.7rem + env(safe-area-inset-top,0px))}
nav .row{max-width:1100px;margin:0 auto;display:flex;align-items:baseline;gap:1.5rem;flex-wrap:wrap}
nav h1{margin:0;font-size:1.4rem}nav .upd{font-size:.78rem;color:var(--soft);margin-left:auto;text-align:right;display:flex;flex-direction:column;line-height:1.3}nav .upd b{font-size:.95rem;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;text-transform:capitalize}
nav .tabs{display:flex;gap:.2rem;overflow-x:auto;max-width:1100px;margin:.3rem auto 0;scrollbar-width:thin}
nav .tabs a{padding:.45rem .8rem;text-decoration:none;font-size:.9rem;font-weight:500;color:var(--soft);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
nav .tabs a.on{color:var(--ink);border-color:var(--clay);font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h2.sec{font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--ink);padding-bottom:.4rem;margin:2rem 0 1rem}
h2.sec:first-child{margin-top:0}
.lede{color:var(--soft);max-width:70ch;font-size:.95rem;margin:0 0 1.25rem}
.empty{color:var(--soft);font-size:.9rem}.note{font-size:.8rem;color:var(--soft)}
.ctl{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.ctl input,.ctl select,.ctl button{font:inherit;font-size:.9rem;padding:.5rem .7rem;border:1px solid var(--ink);background:var(--raised);color:var(--ink)}
.ctl input[type=search]{flex:1 1 240px}.ctl button{cursor:pointer}.ctl button.on{background:var(--indigo);color:var(--onind)}
.ctl label{display:flex;align-items:center;gap:.35rem;font-size:.85rem}.ctl input[type=checkbox]{padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.card{display:block;text-decoration:none;background:var(--raised);border:1px solid var(--line);padding:1rem 1.2rem}
a.card:hover{border-color:var(--ink)}.card .n{font:700 1.8rem Newsreader,serif}.card .l{font-size:.8rem;color:var(--soft)}
.row2{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:.65rem 0;border-bottom:1px solid var(--line)}
a.row2{text-decoration:none}a.row2:hover{background:var(--raised)}
.nm{font-weight:600;overflow-wrap:anywhere}.meta{font-size:.8rem;color:var(--soft)}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:.1rem .5rem;border-radius:2px;color:#fff;background:var(--neu)}
.tag.vigente,.tag.positivo{background:var(--pos)}.tag.negativo{background:var(--neg)}.tag.no-vigente,.tag.neutral{background:var(--neu)}
.flag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--onclay);background:var(--clay);padding:.1rem .5rem;border-radius:2px;margin:.15rem .3rem 0 0}
.warn{display:block;margin:.5rem 0;font-size:.82rem;background:var(--warn);border-left:3px solid var(--clay);padding:.5rem .75rem}
.person{background:var(--raised);border:1px solid var(--line);padding:1.25rem 1.5rem}.person h2{margin:0 0 .2rem;font-size:1.7rem;overflow-wrap:anywhere}
.cargo{border-left:3px solid var(--indigo);padding:.4rem 0 .4rem 1rem;margin-bottom:.8rem}
.sh{font:700 .82rem/1.5 Inter,system-ui,sans-serif;margin:1.5rem 0 .5rem;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}.sh.neg{color:var(--negtx)}
.boxes{display:flex;gap:.6rem;flex-wrap:wrap}.box{border:1px solid var(--line);padding:.4rem .9rem;background:var(--paper)}.box b{display:block;font:700 1.4rem Newsreader,serif}.box span{font-size:.75rem;color:var(--soft)}
.bars{display:flex;align-items:center;gap:2px;height:90px;border-bottom:1px solid var(--line)}
.bars i{flex:1;min-width:2px;background:var(--pos);align-self:flex-end}.bars i.n{background:var(--negtx)}
.bars .z{flex:1;height:100%;display:flex;align-items:flex-end}.bars .z i{display:block;width:100%;flex:none}
.pill{display:inline-block;border:1px solid var(--line);background:var(--paper);padding:.1rem .6rem;margin:0 .3rem .3rem 0;font-size:.82rem;border-radius:99px}
.pill.pol{border-color:var(--indigo)}
.art{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start;padding:.75rem 0;border-bottom:1px solid var(--line)}
.art .t{font:600 1.05rem/1.35 Newsreader,serif;margin:.15rem 0 0}.art .t a{text-decoration:none}.art .t a:hover{text-decoration:underline}
.quote{border-left:3px solid var(--clay);padding:.3rem 0 .3rem 1rem;margin:.6rem 0;font:italic 1.05rem Newsreader,serif}
.day{font-weight:700;text-transform:capitalize;margin:1.5rem 0 .3rem;border-bottom:1px solid var(--ink)}
.star{border:1px solid var(--line);background:var(--raised);cursor:pointer;padding:.1rem .45rem;border-radius:2px;color:var(--ink)}.star.on{background:#FCE9C9;border-color:#C99A3A;color:#000}
.pcol{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:2rem}@media(max-width:860px){.pcol{grid-template-columns:minmax(0,1fr)}}
.pnl{background:var(--raised);border:1px solid var(--line);padding:1rem;margin-bottom:1rem}
.more{font:inherit;padding:.55rem 1rem;border:1px solid var(--ink);background:var(--raised);color:var(--ink);cursor:pointer;margin-top:1rem}
details summary{cursor:pointer;color:var(--indigo);font-weight:600;font-size:.88rem}
.ev{border-bottom:1px solid var(--line);padding:.4rem 0;font-size:.82rem;color:var(--soft);overflow-wrap:anywhere}.ev b{color:var(--ink)}
footer{font-size:.78rem;color:var(--soft);border-top:1px solid var(--line);padding-top:1rem;margin-top:2.5rem}
/* Responsive y accesibilidad */
.tag.ind{background:var(--indigo);color:var(--onind)}
.ctl select,.ctl input{min-width:0;max-width:100%}.ctl select{text-overflow:ellipsis}
.art>div{min-width:0}.art .t,.art .meta{overflow-wrap:anywhere}
.star{flex:none;min-width:2rem;min-height:2rem}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
#app:focus,#app h2:focus{outline:none}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.6rem 1rem;z-index:10;border:0;font:inherit;cursor:pointer}.skip:focus{left:.5rem;top:calc(.5rem + env(safe-area-inset-top,0px))}
</style>
</head>
<body>
<button class="skip" id="skip" type="button">Saltar al contenido</button>
<nav class="top" aria-label="Secciones de NEWAR"><div class="row"><h1>NEWAR</h1><span class="upd"><b id="clock" aria-hidden="true"></b><span id="upd"></span></span></div><div class="tabs" id="tabs"></div></nav>
<main class="wrap" id="app" tabindex="-1"><p class="empty">Cargando datos…</p></main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const FAIL=[];
const REMOTO='https://nexxusconsultora-lab.github.io/salta-monitor/data/';
const bajar=async(url)=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);try{const r=await fetch(url+'?_='+Date.now(),{signal:ac.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(to)}};
/* 1) data/ local; 2) si falla (p. ej. abierto con doble clic desde la PC: file:// bloquea fetch) se leen los datos del sitio publicado */
const J=async(n,fb)=>{if(window.NEWAR_EMBED&&n in NEWAR_EMBED)return NEWAR_EMBED[n];try{return await bajar('data/'+n+'.json')}catch(e){}
 if(!location.href.startsWith(REMOTO.replace(/data\/$/,''))){try{return await bajar(REMOTO+n+'.json')}catch(e){}}
 FAIL.push(n);return fb};
/* Cada vista pide solo los archivos que usa; se descargan una vez y quedan en memoria */
const S={};const SRC={pol:['politicians',[]],agg:['aggregates',null],men:['mentions',[]],dos:['dossiers',{}],top:['topics_data',{topics:{}}],ev:['events',{events:[]}],news:['news_general',[]],of:['oficiales',{items:[]}],ofst:['oficiales_status',{sources:{}}]};
const LOAD={};const need=(...ks)=>Promise.all(ks.map(k=>LOAD[k]||(LOAD[k]=J(SRC[k][0],SRC[k][1]).then(v=>(S[k]=v)))));
const fdate=(v,o)=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('es-AR',o||{dateStyle:'short',timeStyle:'short'})};
function rel(d){const s=(Date.now()-d)/1000;if(s<0)return'ahora';if(s<3600)return`hace ${Math.max(1,Math.round(s/60))} min`;if(s<86400)return`hace ${Math.round(s/3600)} h`;if(s<604800)return`hace ${Math.round(s/86400)} d`;return fdate(d,{dateStyle:'medium'})}
/* Destacados (misma clave que el Radar: las estrellas existentes se conservan) */
const SK='radar_destacados_v1';
const stars=()=>{try{return JSON.parse(localStorage.getItem(SK)||'[]')}catch(e){return[]}};
const setStars=l=>{try{localStorage.setItem(SK,JSON.stringify(l))}catch(e){}};
const isStar=id=>stars().some(s=>s.id===id);
const starLbl=(on,t)=>(on?'Quitar de destacados: ':'Destacar: ')+String(t||'').slice(0,90);
const starBtn=m=>{const on=isStar(m.id);return`<button class="star${on?' on':''}" data-m="${encodeURIComponent(JSON.stringify(m))}" aria-pressed="${on}" aria-label="${esc(starLbl(on,m.title))}" title="Destacar (solo en este navegador)">${on?'★':'☆'}</button>`};
document.addEventListener('click',e=>{const b=e.target.closest('.star');if(!b)return;let m;try{m=JSON.parse(decodeURIComponent(b.dataset.m))}catch(x){return}
 const l=stars(),i=l.findIndex(s=>s.id===m.id);if(i>=0)l.splice(i,1);else l.push({...m,starred_at:new Date().toISOString()});setStars(l);
 const on=i<0;b.textContent=on?'★':'☆';b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',starLbl(on,m.title))});

/* ---------- Modelo NEWAR: persona / cargo / evidencia, derivado de la nómina ---------- */
const INST={'Ejecutivo':['Poder Ejecutivo de Salta','Provincia de Salta','provincial'],'Diputados':['Cámara de Diputados de Salta','Provincia de Salta','provincial'],'Senado':['Cámara de Senadores de Salta','Provincia de Salta','provincial'],'Concejo Deliberante':['Concejo Deliberante de la Ciudad de Salta','Municipio de la Ciudad de Salta','municipal'],'Diputados de la Nación':['Cámara de Diputados de la Nación','República Argentina','nacional'],'Senado de la Nación':['Cámara de Senadores de la Nación','República Argentina','nacional']};
let personas=[],revision=[],byId={},revPor={},revById={};
function mk(p){
 const [inst,jur,niv]=INST[p.chamber]||[p.chamber||'—','—',''];
 const lugar=p.chamber==='Ejecutivo'?'':(p.department||p.distrito||(p.ambito==='Nacional'?'Salta':''));
 const v=p.vigencia==='vigente'?1:(p.vigencia==='ex'?0:null);
 const ev=(campo,valor)=>({campo,valor,fuente:'data/politicians.json',url:p.source_url,obs:p.verificado_en});
 const ev_=[ev('nombre',p.name)];if(p.term_start)ev_.push(ev('desde',p.term_start));if(p.term_end)ev_.push(ev('hasta',p.term_end));ev_.push(ev('vigente',v===1));
 return{id:p.id,nombre:p.name,p,v,inst,jur,niv,cargo:(p.cargo||p.role||'')+(lugar?' por '+lugar:''),desde:p.term_start||null,hasta:p.term_end||null,bloque:p.bloque,ev:ev_}}
function build(){
 const seen={};[...S.pol].sort((a,b)=>(b.vigencia==='vigente')-(a.vigencia==='vigente')).forEach(p=>{const k=fold(p.name);
  if(seen[k]){revById[p.id]=mk(p);revision.push({json_id:p.id,nombre:p.name,coincide:seen[k]});(revPor[seen[k]]=revPor[seen[k]]||[]).push(p.id)}
  else{seen[k]=p.id;personas.push(mk(p))}});
 personas.sort((a,b)=>fold(a.nombre).localeCompare(fold(b.nombre)));personas.forEach(x=>byId[x.id]=x)}
const badge=v=>v===1?'<span class="tag vigente">vigente</span>':v===0?'<span class="tag no-vigente">no vigente</span>':'<span class="tag">vigencia sin dato</span>';
const total=id=>((S.agg&&S.agg.by_politician||{})[id]||{}).total||0;

/* ---------- Piezas reutilizables ---------- */
const boxes=(t,b)=>`<div class="boxes"><div class="box"><b>${t}</b><span>Menciones</span></div><div class="box"><b>${b.positivo}</b><span>Positivas</span></div><div class="box"><b>${b.negativo}</b><span>Negativas</span></div><div class="box"><b>${b.neutral}</b><span>Neutras</span></div></div>`;
function toneBars(sbd){const days=Object.keys(sbd||{}).sort().slice(-45);if(!days.length)return'<p class="empty">Sin datos.</p>';
 const mx=Math.max(1,...days.map(d=>Math.abs(sbd[d].score_sum)));
 return`<div class="bars">${days.map(d=>{const s=sbd[d].score_sum;return`<div class="z" title="${d}: ${s}"><i class="${s<0?'n':''}" style="height:${Math.max(3,Math.abs(s)/mx*100)}%"></i></div>`}).join('')}</div><p class="note">Balance de tono por día (verde: positivo, rojo: negativo). Heurística por palabras clave.</p>`}
const quotes=(l,pre)=>l&&l.length?l.map((q,i)=>`<div class="art"><div><div class="quote">“${esc(q.quote)}”</div><span class="meta">${esc(q.source)} · <a href="${esc(safe(q.link))}" target="_blank" rel="noopener">ver nota original</a></span></div>${starBtn({id:pre+i,type:'cita',title:q.quote,link:q.link,source:q.source,date:q.date})}</div>`).join(''):'<p class="empty">Todavía no se detectaron citas textuales.</p>';
const arts=l=>l&&l.length?l.map(a=>`<div class="art"><div><div class="meta"><span class="tag ${esc(a.sentiment_label)}">${esc(a.sentiment_label)}</span> ${esc(a.source)} · ${fdate(a.date)}</div><p class="t"><a href="${esc(safe(a.link))}" target="_blank" rel="noopener">${esc(a.title)}</a></p></div>${starBtn({id:a.link,type:'articulo',title:a.title,link:a.link,source:a.source,date:a.date})}</div>`).join(''):'<p class="empty">Sin artículos todavía.</p>';
const ofCard=it=>`<article class="art"><div style="min-width:0"><div class="meta"><span class="tag">${esc(it.jurisdiccion||'—')}</span> <span class="tag ind">${esc(it.tipo_acto||'Otro')}</span> ${esc(it.organismo||it.fuente)} · ${esc(it.fecha_publicacion||(it.first_seen||'').slice(0,10))}</div><p class="t"><a href="${esc(safe(it.url))}" target="_blank" rel="noopener">${esc(it.titulo)}</a></p>${it.resumen?`<p class="meta">${esc(it.resumen)}</p>`:''}${(it.personas||[]).map(id=>`<a class="pill pol" href="#/persona/${encodeURIComponent(id)}">${esc((S.polById[id]||{}).name||id)}</a>`).join('')}${it.personas&&it.personas.length&&it.contexto?`<p class="meta">Apareció en: “${esc(it.contexto)}”</p>`:''}</div>${starBtn({id:'oficial-'+it.id,type:'oficial',title:it.titulo,link:it.url,source:it.fuente,date:it.fecha_publicacion})}</article>`;
function pager(el,items,render,size){let n=size;const draw=()=>{el.innerHTML=items.slice(0,n).map(render).join('')+(items.length>n?'<button class="more">Mostrar más</button>':'');const b=el.querySelector('.more');if(b)b.onclick=()=>{const prev=n;n+=size;draw();const nx=el.children[prev];if(nx){if(!nx.matches('a[href],button'))nx.tabIndex=-1;nx.focus()}}};draw()}

/* ---------- Vistas ---------- */
const V={};
V.inicio=()=>{
 setTimeout(()=>need('men','news','of').then(()=>{const set=(i,v)=>{const e=$('#'+i);if(e)e.textContent=v};set('k-men',S.men.length);set('k-news',S.news.length);set('k-of',(S.of.items||[]).length)}));
 const vig=personas.filter(p=>p.v===1).length,top=personas.map(p=>[p,total(p.id)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const tt=Object.values(S.top.topics||{}).sort((a,b)=>b.total_mentions-a.total_mentions).slice(0,6);
 const bd=(S.agg&&S.agg.by_day)||{},days=Object.keys(bd).sort().slice(-14),vals=days.map(d=>Object.values(bd[d]).reduce((s,v)=>s+v.total,0)),mx=Math.max(1,...vals);
 const c=(n,l,h,id)=>`<a class="card" href="#/${h}"><div class="n"${id?` id="${id}"`:''}>${n}</div><div class="l">${l}</div></a>`;
 return`<h2 class="sec">NEWAR</h2><p class="lede">Separa <b>quién es</b> una persona, <b>qué cargos</b> ocupó u ocupa y <b>con qué evidencia</b> se sabe; y le suma lo que dice la prensa y los boletines oficiales sobre ella. Lo que no está registrado se muestra como tal: nunca se inventa.</p>
 <div class="grid">${c(personas.length,'personas','personas')}${c(vig,'con cargo vigente','personas')}${c('…','menciones en prensa','menciones','k-men')}${c(Object.keys(S.top.topics||{}).length,'temas seguidos','temas')}${c((S.ev.events||[]).length,'eventos conectados','eventos')}${c('…','noticias generales','resumen','k-news')}${c('…','publicaciones oficiales','oficiales','k-of')}${c(stars().length,'destacados','destacados')}</div>
 <h2 class="sec">Personas con más cobertura</h2>${top.length?top.map(([p,t])=>`<a class="row2" href="#/persona/${encodeURIComponent(p.id)}"><span class="nm">${esc(p.nombre)} <span class="meta">${esc(p.cargo)}</span></span><span class="meta">${t} menciones</span></a>`).join(''):'<p class="empty">Sin datos todavía.</p>'}
 <h2 class="sec">Temas más activos</h2>${tt.length?tt.map(t=>`<a class="row2" href="#/tema/${encodeURIComponent(t.id)}"><span class="nm">${esc(t.name)}</span><span class="meta">${t.total_mentions} menciones</span></a>`).join(''):'<p class="empty">No hay temas configurados (data/topics.json).</p>'}
 <h2 class="sec">Volumen de menciones, últimos 14 días</h2><div class="bars">${vals.map((v,i)=>`<i title="${days[i]}: ${v}" style="height:${Math.max(3,v/mx*100)}%;background:var(--clay)"></i>`).join('')||''}</div>
 <footer>Datos de medios digitales públicos y páginas oficiales. El tono y los temas son heurísticos (palabras clave), no un modelo de IA. Las coincidencias de nombre no verifican identidad: puede haber homónimos.</footer>`};

V.personas=()=>{
 const insts=[...new Set(personas.map(p=>p.inst))].sort();
 setTimeout(()=>{const go=()=>{const q=fold($('#q').value.trim()),i=$('#fi').value,v=$('#fv').value,s=$('#fs').value;
  let l=personas.filter(p=>(!q||fold(p.nombre).includes(q))&&(!i||p.inst===i)&&(v===''||String(p.v)===v));
  if(s==='m')l.sort((a,b)=>total(b.id)-total(a.id));
  pager($('#res'),l,p=>`<a class="row2" href="#/persona/${encodeURIComponent(p.id)}"><div><div class="nm">${esc(p.nombre)}</div><div class="meta">${esc(p.cargo)} · ${esc(p.inst)}${total(p.id)?' · '+total(p.id)+' menciones':''}</div>${revPor[p.id]?'<span class="flag">Identidad en revisión</span>':''}</div>${badge(p.v)}</a>`,60);
  $('#cnt').textContent=l.length+' personas'};
  ['q','fi','fv','fs'].forEach(id=>$('#'+id).addEventListener('input',go));go()});
 return`<h2 class="sec">Personas</h2><div class="ctl"><input type="search" id="q" aria-label="Buscar persona por nombre" placeholder="Buscar por nombre… (probá 'sáenz', 'caro', 'navarro')" autocomplete="off"><select id="fi" aria-label="Institución"><option value="">Todas las instituciones</option>${insts.map(i=>`<option>${esc(i)}</option>`).join('')}</select><select id="fv" aria-label="Vigencia"><option value="">Vigentes y no vigentes</option><option value="1">Solo vigentes</option><option value="0">Solo no vigentes</option></select><select id="fs" aria-label="Orden"><option value="n">Orden alfabético</option><option value="m">Más mencionados</option></select></div><p class="note" id="cnt"></p><div id="res"></div>${revision.length?`<h3 class="sh">Filas en revisión (${revision.length})</h3><p class="note">Mismo nombre que otra fila ya incorporada. No se fusionan: esperan una decisión humana.</p>${revision.map(r=>`<a class="row2" href="#/persona/${encodeURIComponent(r.json_id)}"><div><div class="nm">${esc(r.nombre)}</div><div class="meta">${total(r.json_id)} menciones atribuidas a esta fila</div></div><span class="flag">En revisión</span></a>`).join('')}`:''}
 <footer>Si dos filas de la nómina tienen el mismo nombre, NEWAR no las fusiona: la fila repetida queda “en revisión” hasta que una persona decida. Vigencia y período se muestran tal como están registrados, sin interpretarlos.</footer>`};

V.persona=id=>{
 const enRev=!byId[id]&&revById[id],p=byId[id]||revById[id];if(!p)return'<p class="empty">No se encontró esa persona. <a href="#/personas">Volver al listado</a></p>';
 const d=S.dos[id],ofs=(S.of.items||[]).filter(i=>(i.personas||[]).includes(id)).slice(0,15);
 const kp=enRev?((revision.find(r=>r.json_id===id)||{}).coincide):null,av=enRev?`<span class="warn"><b>Fila en revisión.</b> Esta fila de la nómina tiene el mismo nombre que ${byId[kp]?`<a href="#/persona/${encodeURIComponent(kp)}">${esc(byId[kp].nombre)}</a>`:'otra fila'} y <b>no se fusionó</b>: queda pendiente de una decisión humana. No se asumió que sean la misma persona; lo que ves abajo corresponde solo a esta fila.</span>`:(revPor[id]||[]).map(r=>`<span class="warn">La nómina contiene otra fila con este nombre (<code>${esc(r)}</code>) que <b>no se incorporó</b> por posible duplicado. Queda pendiente de revisión humana; no se asumió que sea la misma persona.</span>`).join('');
 const ETQ={nombre:'Nombre',vigente:'Vigencia',desde:'Desde',hasta:'Hasta'};
 const cargo=`<div class="cargo"><div class="nm">${esc(p.cargo)} ${badge(p.v)}</div><div class="meta">${esc(p.inst)} · ${esc(p.jur)}${p.niv?' ('+p.niv+')':''}${p.bloque?' · bloque '+esc(p.bloque):''}</div><div class="meta">Desde: ${p.desde?esc(p.desde):'Sin fecha de inicio registrada'} · Hasta: ${p.hasta?esc(p.hasta):'Sin fecha de finalización registrada'}</div></div>`;
 const prensa=d?`${boxes(d.total_mentions,d.sentiment_breakdown)}<h3 class="sh">Tono en el tiempo</h3>${toneBars(d.sentiment_by_day)}<h3 class="sh">Temas asociados</h3>${(d.top_topics||[]).map(t=>`<span class="pill">${esc(t.term)} · ${t.count}</span>`).join('')||'<p class="empty">Sin datos.</p>'}
 ${(d.legal_mentions||[]).length?`<h3 class="sh neg">Menciones con vocabulario judicial en prensa</h3><p class="warn"><b>No es una acusación ni una verificación legal.</b> Son notas cuyo título usa palabras como “denuncia” o “imputado”; pueden referirse a un tercero o ser una desmentida. Leé siempre la nota original.</p>${d.legal_mentions.map(l=>`<div class="art"><a href="${esc(safe(l.link))}" target="_blank" rel="noopener">${esc(l.title)}</a><span class="meta">${esc(l.source)}</span></div>`).join('')}`:''}
 <h3 class="sh">Declaraciones citadas por los medios</h3>${quotes(d.quotes,'q-'+id+'-')}<h3 class="sh">Artículos recientes</h3>${arts(d.recent_articles)}
 <p class="note">Las menciones las atribuye el monitor por alias del nombre; no está verificado que todas correspondan a la misma persona física. Las citas son extracción textual, no verificación periodística.</p>`:'<p class="empty">Sin menciones registradas por el monitor para esta persona.</p>';
 const evd=`<details><summary>Ver evidencia (${p.ev.length} datos respaldados)</summary>${p.ev.map(i=>`<div class="ev"><b>${ETQ[i.campo]}:</b> ${esc(i.campo==='vigente'?(i.valor?'vigente':'no vigente'):i.valor)}<br>Fuente: ${esc(i.fuente)} · ${/^https?:/.test(i.url||'')?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url)}</a>`:'sin URL'}<br>Verificado en: ${esc(i.obs||'sin fecha')}</div>`).join('')}<p class="note">La fuente es la nómina (<code>politicians.json</code>); la URL es la página oficial que cita y la fecha es la de su verificación declarada. No es una verificación independiente.</p></details>`;
 return`<p><a href="#/personas">← Volver al listado</a></p><div class="person"><h2>${esc(p.nombre)}</h2><div class="meta">identificador de la nómina: <code>${esc(p.id)}</code></div>${av}<h3 class="sh">Cargos</h3>${cargo}<h3 class="sh">Prensa</h3>${prensa}<h3 class="sh">Publicaciones oficiales que nombran a esta persona</h3>${ofs.length?ofs.map(ofCard).join(''):'<p class="empty">Ninguna registrada. (Se busca el nombre completo en boletines y sitios oficiales.)</p>'}<h3 class="sh">Evidencia</h3>${evd}</div>`};

V.menciones=()=>{
 const act=p=>!p||p.vigencia!=='ex';let n=80;
 const meds=[...new Set(S.men.map(m=>m.source).filter(Boolean))].sort();
 setTimeout(()=>{const go=()=>{const pol=$('#mp').value,t=$('#mt').value,k=fold($('#mk').value.trim()),h=+$('#mh').value,src=$('#ms').value,ex=$('#mx').checked;
  const l=S.men.filter(m=>{const p=S.polById[m.politician_id];const d=new Date(m.published_iso||m.published);
   return(ex||act(p))&&(!pol||m.politician_id===pol)&&(!t||m.sentiment_label===t)&&(!src||m.source===src)&&(!k||fold(m.title).includes(k))&&(!h||(!isNaN(d)&&Date.now()-d<h*36e5))})
   .map(m=>[m,new Date(m.published_iso||m.published).getTime()||0]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  $('#mc').textContent=l.length+' menciones';
  pager($('#mf'),l,m=>{const d=new Date(m.published_iso||m.published),p=S.polById[m.politician_id];return`<article class="art"><div><div class="meta"><span class="tag ${esc(m.sentiment_label)}">${esc(m.sentiment_label)}</span> <a href="#/persona/${encodeURIComponent(m.politician_id)}"><b>${esc(m.politician_name)}</b></a>${p&&p.vigencia==='ex'?' (ex)':''} · ${esc(m.source||'')} · ${isNaN(d)?'sin fecha':esc(rel(d))}</div><p class="t"><a href="${esc(safe(m.link))}" target="_blank" rel="noopener">${esc(m.title)}</a></p></div>${starBtn({id:m.id,type:'mencion',title:m.title,link:m.link,source:m.source,date:isNaN(d)?'':d.toISOString()})}</article>`},n)};
  ['mp','mt','mk','mh','ms','mx'].forEach(i=>$('#'+i).addEventListener('input',go));go();
  const a=S.agg||{};$('#mtr').innerHTML=(a.trending_terms||[]).map(t=>`<div class="row2"><span>${esc(t.term)}</span><span class="meta">${t.count}</span></div>`).join('')||'<p class="empty">Sin datos.</p>';
  $('#mco').innerHTML=(a.comentions||[]).map(c=>`<div class="row2"><span>${esc(c.a)} + ${esc(c.b)}</span><span class="meta">${c.count}</span></div>`).join('')||'<p class="empty">Sin cruces detectados.</p>'});
 const pols=[...personas,...Object.values(revById)].filter(p=>total(p.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
 return`<h2 class="sec">Menciones en prensa</h2><div class="pcol"><div><div class="ctl"><select id="mp" aria-label="Persona"><option value="">Todas las personas</option>${pols.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)}${p.v===0?' (ex)':''}${revById[p.id]?' (en revisión)':''}</option>`).join('')}</select><select id="mt" aria-label="Tono"><option value="">Cualquier tono</option><option value="positivo">Positivo</option><option value="neutral">Neutral</option><option value="negativo">Negativo</option></select><input type="search" id="mk" aria-label="Filtrar por palabra clave" placeholder="Palabra clave…"></div><div class="ctl"><select id="mh" aria-label="Fecha"><option value="0">Cualquier fecha</option><option value="3">Últimas 3 horas</option><option value="24">Últimas 24 horas</option><option value="72">Últimos 3 días</option><option value="168">Últimos 7 días</option><option value="720">Últimos 30 días</option></select><select id="ms" aria-label="Medio"><option value="">Todos los medios</option>${meds.map(m=>`<option>${esc(m)}</option>`).join('')}</select><label><input type="checkbox" id="mx"> Incluir ex funcionarios</label></div><p class="note" id="mc"></p><div id="mf"></div></div>
 <aside><div class="pnl"><b>Temas en tendencia</b><p class="note">Palabras más repetidas en títulos, últimas 48 h.</p><div id="mtr"></div></div><div class="pnl"><b>Menciones cruzadas</b><p class="note">Personas que aparecen juntas en la misma noticia.</p><div id="mco"></div></div></aside></div>`};

V.temas=()=>{const l=Object.values(S.top.topics||{});return`<h2 class="sec">Temas seguidos</h2><p class="lede">Además de personas, se siguen temas puntuales (una obra, un presupuesto, una causa). Se configuran en <code>data/topics.json</code>.</p>${l.length?l.map(t=>`<a class="row2" href="#/tema/${encodeURIComponent(t.id)}"><span class="nm">${esc(t.name)}<br><span class="meta">${t.sentiment_breakdown.positivo} positivas · ${t.sentiment_breakdown.negativo} negativas · ${t.politicians_involved.length} personas involucradas</span></span><span class="meta">${t.total_mentions} menciones</span></a>`).join(''):'<p class="empty">No hay temas configurados todavía.</p>'}`};
V.tema=id=>{const t=(S.top.topics||{})[id];if(!t)return'<p class="empty">No hay datos para este tema. <a href="#/temas">Volver</a></p>';
 const byName={};personas.forEach(p=>byName[p.nombre]=p.id);
 return`<p><a href="#/temas">← Volver a temas</a></p><h2 class="sec">${esc(t.name)}</h2>${boxes(t.total_mentions,t.sentiment_breakdown)}<h3 class="sh">Tono en el tiempo</h3>${toneBars(t.sentiment_by_day)}<h3 class="sh">Personas involucradas</h3>${t.politicians_involved.map(p=>byName[p.name]?`<a class="pill pol" href="#/persona/${encodeURIComponent(byName[p.name])}">${esc(p.name)} · ${p.count}</a>`:`<span class="pill">${esc(p.name)} · ${p.count}</span>`).join('')||'<p class="empty">Sin identificar.</p>'}<h3 class="sh">Declaraciones citadas</h3>${quotes(t.quotes,'tq-'+id+'-')}<h3 class="sh">Artículos recientes</h3>${arts(t.recent_articles)}`};

V.eventos=()=>{const l=S.ev.events||[];return`<h2 class="sec">Eventos conectados</h2><p class="lede">Noticias de distintas fuentes que probablemente hablan del mismo hecho (ventana de 72 h, por palabras compartidas en el título). <b>Es agrupamiento por texto, no comprensión del contenido</b>: puede juntar notas sin relación.</p>${l.length?l.map(e=>`<div class="pnl"><h3 style="margin:.1rem 0 .5rem">${esc(e.title)}</h3><div><span class="pill">${e.items_count} notas</span><span class="pill">${e.sources.length} medios: ${esc(e.sources.join(', '))}</span>${e.politicians.map(p=>`<span class="pill pol">${esc(p)}</span>`).join('')}${e.topics.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><ul>${e.items.map(i=>`<li><a href="${esc(safe(i.link))}" target="_blank" rel="noopener">${esc(i.title)}</a> — ${esc(i.source)}</li>`).join('')}</ul></div>`).join(''):'<p class="empty">Todavía no se detectaron eventos con varias fuentes.</p>'}`};

V.resumen=()=>{setTimeout(()=>{let h=12;const go=()=>{const cat=$('#rc').value,cut=Date.now()-h*36e5;
 const l=S.news.filter(n=>(!cat||n.category===cat)&&(isNaN(new Date(n.collected_at))||new Date(n.collected_at)>=cut));
 $('#rn').textContent=h>=9999?`Todo lo guardado (${l.length} notas)`:`Desde ${fdate(cut)} — ${l.length} notas`;
 const g={};l.forEach(n=>{const d=new Date(n.published||n.collected_at);(g[isNaN(d)?'Fecha desconocida':d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})]=g[isNaN(d)?'Fecha desconocida':d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})]||[]).push(n)});
 $('#rl').innerHTML=Object.entries(g).map(([d,a])=>`<div class="day">${esc(d)}</div>`+a.map(n=>`<article class="art"><div><div class="meta"><span class="tag">${esc(n.category)}</span> ${esc(n.source||'')} · ${fdate(n.published||n.collected_at,{timeStyle:'short'})}</div><p class="t"><a href="${esc(safe(n.link))}" target="_blank" rel="noopener">${esc(n.title)}</a></p></div>${starBtn({id:n.id,type:'noticia_general',title:n.title,link:n.link,source:n.source,date:n.published})}</article>`).join('')).join('')||'<p class="empty">No hay noticias en esa ventana. Probá ampliarla.</p>'};
 document.querySelectorAll('#rb button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#rb button').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});b.classList.add('on');b.setAttribute('aria-pressed','true');h=+b.dataset.h;go()});$('#rc').oninput=go;go()});
 return`<h2 class="sec">Resumen Nacional / Provincial</h2><p class="lede">Noticias generales (no solo de las personas seguidas) de medios nacionales y de Salta, para leer rápido qué pasó en las últimas horas.</p><div class="ctl" id="rb"><button data-h="6" aria-pressed="false">Últimas 6 h</button><button data-h="12" class="on" aria-pressed="true">Últimas 12 h</button><button data-h="24" aria-pressed="false">Últimas 24 h</button><button data-h="9999" aria-pressed="false">Todo</button><select id="rc" aria-label="Alcance"><option value="">Nacional + Provincial</option><option>Nacional</option><option>Provincial</option></select></div><p class="note" id="rn"></p><div id="rl"></div>`};

V.oficiales=()=>{const it=S.of.items||[];const opt=k=>[...new Set(it.map(i=>i[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')).map(v=>`<option>${esc(v)}</option>`).join('');
 setTimeout(()=>{const go=()=>{const f=$('#of').value,t=$('#ot').value,q=fold($('#oq').value.trim()),pp=$('#op').checked;
  const l=it.filter(i=>(!f||i.fuente===f)&&(!t||i.tipo_acto===t)&&(!pp||(i.personas||[]).length)&&(!q||fold((i.titulo||'')+(i.resumen||'')+(i.organismo||'')).includes(q)))
   .map((i,x)=>[i,x]).sort((a,b)=>((b[0].fecha_publicacion||(b[0].first_seen||'').slice(0,10))).localeCompare(a[0].fecha_publicacion||(a[0].first_seen||'').slice(0,10))||a[1]-b[1]).map(x=>x[0]);
  $('#oc').textContent=l.length+' publicaciones';pager($('#ol'),l,ofCard,100)};['of','ot','oq','op'].forEach(i=>$('#'+i).addEventListener('input',go));go()});
 const st=Object.values((S.ofst||{}).sources||{});
 return`<h2 class="sec">Publicaciones oficiales</h2><p class="lede">Boletines oficiales, justicia, legislatura y municipio, leídos de sus páginas públicas. Cada publicación lleva el enlace al documento original: esa es la fuente. El nombre marcado es una <b>coincidencia de texto, no una verificación de identidad</b>.</p><div class="ctl"><select id="of" aria-label="Fuente"><option value="">Todas las fuentes</option>${opt('fuente')}</select><select id="ot" aria-label="Tipo de publicación"><option value="">Todos los tipos</option>${opt('tipo_acto')}</select><input type="search" id="oq" aria-label="Buscar en publicaciones oficiales" placeholder="Buscar en títulos y resúmenes…"><label><input type="checkbox" id="op"> Solo las que nombran a alguien</label></div><p class="note" id="oc"></p><div id="ol"></div>
 <h2 class="sec">Estado de las fuentes</h2>${st.length?st.map(s=>`<div class="row2"><span><span class="tag ${s.state==='ok'?'vigente':s.state==='error'?'negativo':''}">${esc(s.state)}</span> <b>${esc(s.name)}</b><br><span class="meta">${esc(s.message)} · <a href="${esc(safe(s.url))}" target="_blank" rel="noopener">abrir la fuente</a></span></span></div>`).join(''):'<p class="empty">Todavía no corrió el recolector.</p>'}`};

V.destacados=()=>{setTimeout(()=>{document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{setStars(stars().filter(s=>s.id!==b.dataset.id));route()})});
 const l=stars().sort((a,b)=>(b.starred_at||'').localeCompare(a.starred_at||''));
 return`<h2 class="sec">Destacados</h2><p class="lede"><b>Guardados solo en este navegador</b>: no se suben al repositorio ni se comparten entre dispositivos.</p>${l.length?l.map(i=>`<div class="art"><div><span class="pill">${esc(i.type||'item')}</span><a href="${esc(safe(i.link))}" target="_blank" rel="noopener">${esc(i.title)}</a><div class="meta">${esc(i.source||'')} ${i.date?'· '+fdate(i.date):''}</div></div><button class="more rm" style="margin:0" data-id="${esc(i.id)}">Quitar</button></div>`).join(''):'<p class="empty">Todavía no destacaste nada. Buscá el ícono ☆ en menciones, citas y publicaciones.</p>'}`};

/* ---------- Router ---------- */
const TABS=[['inicio','Inicio'],['personas','Personas'],['menciones','Menciones'],['temas','Temas'],['eventos','Eventos'],['resumen','Resumen'],['oficiales','Oficiales'],['destacados','Destacados']];
const NEEDS={inicio:['top','ev'],personas:['agg'],persona:['agg','dos','of'],menciones:['agg','men'],temas:['top'],tema:['top'],eventos:['ev'],resumen:['news'],oficiales:['of','ofst'],destacados:[]};
const SITIO='https://nexxusconsultora-lab.github.io/salta-monitor/';
let firstRoute=true,rt=0;
async function route(){const my=++rt;const [v,arg]=(location.hash.replace(/^#\/?/,'')||'inicio').split('/');const name=V[v]?v:'inicio',id=arg?decodeURIComponent(arg):'';
 const tab=(name==='persona')?'personas':(name==='tema'?'temas':name);
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#/${k}" class="${k===tab?'on':''}"${k===tab?' aria-current="page"':''}>${l}</a>`).join('');
 const ns=NEEDS[name]||[];
 if(ns.some(k=>!(k in S))){$('#app').innerHTML='<p class="empty" role="status">Cargando datos…</p>';await need(...ns);if(my!==rt)return}
 const aviso=!FAIL.length?'':(location.protocol==='file:'&&!window.NEWAR_EMBED
  ?`<p class="warn" role="alert"><b>Abriste NEWAR directamente desde un archivo.</b> Así el navegador bloquea la lectura de los datos. Entrá al sitio publicado: <a href="${esc(SITIO)}">${esc(SITIO)}</a>, o pedí la versión sin conexión (<code>newar-offline.html</code>).</p>`
  :`<p class="warn" role="alert">No se pudieron cargar estos datos: <code>${esc(FAIL.join(', '))}</code>. Lo que ves puede estar incompleto o vacío. Probá recargar la página.</p>`);
 $('#app').innerHTML=aviso+V[name](id);window.scrollTo(0,0);
 document.title='NEWAR — '+(name==='persona'&&(byId[id]||revById[id])?(byId[id]||revById[id]).nombre:(TABS.find(t=>t[0]===tab)||[0,'Inicio'])[1]);
 const h=$('#app h2');if(!firstRoute&&h){h.tabIndex=-1;h.focus({preventScroll:true})}firstRoute=false}

/* Reloj: hora actual del dispositivo, actualizada cada minuto (alineada al cambio de minuto) */
function tick(){const el=$('#clock');if(!el)return;const d=new Date();
 el.textContent=d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
 el.setAttribute('datetime',d.toISOString())}
function startClock(){tick();const w=60000-(Date.now()%60000)+50;setTimeout(()=>{tick();setInterval(tick,60000)},w)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
startClock();
$('#skip').addEventListener('click',()=>$('#app').focus());
window.addEventListener('hashchange',route);
(async()=>{
 await need('pol','agg');S.polById={};S.pol.forEach(p=>S.polById[p.id]=p);build();
 if(S.agg&&S.agg.generated_at)$('#upd').textContent='Datos al '+fdate(S.agg.generated_at);
 route()})();
</script>
