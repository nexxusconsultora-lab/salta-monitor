<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Destacados — Radar Político Salta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE2; --paper-raised:#FBF8F1; --ink:#211D1A; --ink-soft:#5C554C;
    --line:#D9D1BF; --clay:#B1502E; --indigo:#2B3A55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;}
  h1,.serif{font-family:'Newsreader',Georgia,serif;}
  a{color:inherit;}
  .wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  .back-link{font-size:.85rem;color:var(--ink-soft);text-decoration:none;}
  header{border-bottom:3px solid var(--ink);padding-bottom:1.25rem;margin:1rem 0 1.5rem;}
  header h1{font-size:clamp(1.7rem,4vw,2.3rem);margin:.25rem 0 0;}
  .lede{max-width:65ch;color:var(--ink-soft);margin:.6rem 0 0;font-size:.9rem;}
  .lede strong{color:var(--ink);}
  .item-row{padding:.9rem 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;}
  .item-title{margin:0 0 .25rem;font-weight:500;}
  .item-title a{color:var(--ink);text-decoration:none;}
  .item-title a:hover{text-decoration:underline;}
  .item-meta{font-size:.78rem;color:var(--ink-soft);}
  .remove-btn{border:1px solid var(--line);background:var(--paper-raised);cursor:pointer;font-size:.78rem;padding:.3rem .6rem;flex-shrink:0;}
  .type-tag{display:inline-block;background:var(--indigo);color:#fff;font-size:.68rem;padding:.1rem .45rem;border-radius:2px;margin-right:.4rem;text-transform:uppercase;}
  .empty-state{color:var(--ink-soft);font-size:.9rem;padding:2rem 0;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="./centro.html">← Volver al centro de control</a>
  <header>
    <h1>Destacados</h1>
    <p class="lede">
      <strong>Guardado solo en este navegador</strong> (no se sube al
      repositorio ni se comparte entre dispositivos). Si lo abrís desde otro
      celular o computadora, esta lista va a estar vacía ahí.
    </p>
  </header>
  <div id="list"><p class="empty-state">Cargando…</p></div>
</div>

<script src="./shared.js"></script>
<script>
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

function render(){
  const items = window.RadarDestacados.getStars().sort((a,b)=> (b.starred_at||'').localeCompare(a.starred_at||''));
  const el = document.getElementById('list');
  if(!items.length){
    el.innerHTML = '<p class="empty-state">Todavía no destacaste nada. Buscá el ícono ☆ en las noticias, citas o políticos del panel.</p>';
    return;
  }
  el.innerHTML = items.map(it => `
    <div class="item-row">
      <div>
        <p class="item-title"><span class="type-tag">${escapeHtml(it.type || 'item')}</span><a href="${it.link || '#'}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a></p>
        <p class="item-meta">${escapeHtml(it.source || '')} ${it.date ? '· ' + new Date(it.date).toLocaleString('es-AR') : ''}</p>
      </div>
      <button class="remove-btn" data-id="${escapeHtml(it.id)}">Quitar</button>
    </div>`).join('');
}

document.addEventListener('click', e=>{
  const btn = e.target.closest('.remove-btn');
  if(!btn) return;
  window.RadarDestacados.toggleStar({ id: btn.dataset.id });
  render();
});

render();
</script>
</body>
</html>
