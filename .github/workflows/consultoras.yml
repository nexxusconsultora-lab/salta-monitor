name: Consultoras, bancos y organismos

on:
  # Corre cuando cambia algún script o el directorio (así la pestaña tiene datos sin esperar).
  # No incluye los archivos de datos a propósito: así el commit de datos no dispara otra corrida.
  push:
    branches: [main]
    paths:
      - "scripts/consultoras.py"
      - "scripts/macro.py"
      - "data/consultoras.json"
      - ".github/workflows/consultoras.yml"
  schedule:
    # Cuatro veces por día (hora UTC de GitHub; no es exacto cuando hay mucha carga).
    - cron: "20 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: consultoras-newar
  cancel-in-progress: false

jobs:
  consultoras:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Instalar lector de RSS
        run: pip install feedparser

      - name: Recolectar notas de consultoras, bancos y organismos
        run: python scripts/consultoras.py

      # Si la API del FMI no responde, este paso no rompe el resto: se conserva el archivo anterior.
      - name: Bajar la macro del mundo (FMI)
        continue-on-error: true
        run: python scripts/macro.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/consultoras_news.json
          if [ -f data/macro_mundo.json ]; then git add data/macro_mundo.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de consultoras y macro"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
