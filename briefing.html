<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resumen Nacional/Provincial — Radar Político Salta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE2; --paper-raised:#FBF8F1; --ink:#211D1A; --ink-soft:#5C554C;
    --line:#D9D1BF; --clay:#B1502E; --indigo:#2B3A55;
    --positivo:#4C7A5D; --negativo:#8B3A3A; --neutral:#8A8072;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;}
  h1,h2,.serif{font-family:'Newsreader',Georgia,serif;}
  a{color:inherit;}
  .wrap{max-width:1000px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  .back-link{font-size:.85rem;color:var(--ink-soft);text-decoration:none;}
  header{border-bottom:3px solid var(--ink);padding-bottom:1.25rem;margin:1rem 0 1.5rem;}
  header h1{font-size:clamp(1.7rem,4vw,2.3rem);margin:.25rem 0 0;}
  .lede{max-width:65ch;color:var(--ink-soft);margin:.6rem 0 0;font-size:.95rem;}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:1.5rem 0;padding-bottom:1rem;border-bottom:1px solid var(--line);}
  .controls button{
    font-family:inherit;font-size:.85rem;padding:.5rem .9rem;border:1px solid var(--ink);
    background:var(--paper-raised);cursor:pointer;
  }
  .controls button.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .controls select{font-family:inherit;font-size:.85rem;padding:.5rem .6rem;border:1px solid var(--ink);background:var(--paper-raised);}
  .window-note{font-size:.82rem;color:var(--ink-soft);width:100%;margin-top:.3rem;}

  .day-divider{
    font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-soft);margin:1.75rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px dashed var(--line);
  }
  article.item{padding:1rem 0;border-bottom:1px solid var(--line);}
  .item-meta{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft);margin-bottom:.3rem;}
  .cat-tag{display:inline-block;padding:.15rem .55rem;font-size:.72rem;font-weight:600;border-radius:2px;color:#fff;}
  .cat-tag.Nacional{background:var(--indigo);}
  .cat-tag.Provincial{background:var(--clay);}
  .item-title{margin:0;font-size:1.1rem;}
  .item-title a{color:var(--ink);text-decoration:none;}
  .item-title a:hover{text-decoration:underline;}
  .empty-state{color:var(--ink-soft);font-size:.9rem;padding:2rem 0;}
  .star-btn{border:1px solid var(--line);background:var(--paper-raised);cursor:pointer;font-size:.9rem;line-height:1;padding:.15rem .45rem;border-radius:2px;flex-shrink:0;}
  .star-btn.is-starred{background:#FCE9C9;border-color:#C99A3A;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="./centro.html">← Volver al centro de control</a>
  <header>
    <h1>Resumen Nacional / Provincial</h1>
    <p class="lede">
      Noticias generales (no solo de los políticos que seguís) de medios
      nacionales y de Salta y sus departamentos, para leer rápido qué pasó
      en las últimas horas. Cada nota muestra el medio de origen.
    </p>
  </header>

  <div class="controls">
    <button data-hours="6">Últimas 6 horas</button>
    <button data-hours="12" class="active">Últimas 12 horas</button>
    <button data-hours="24">Últimas 24 horas</button>
    <button data-hours="9999">Todo lo guardado</button>
    <select id="filter-category">
      <option value="">Nacional + Provincial</option>
      <option value="Nacional">Solo Nacional</option>
      <option value="Provincial">Solo Provincial</option>
    </select>
    <span class="window-note" id="window-note"></span>
  </div>

  <div id="list"><p class="empty-state">Cargando…</p></div>
</div>

<script src="./shared.js"></script>
<script>
let allNews = [];
let hoursWindow = 12;
let category = '';

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function load(){
  try{
    allNews = await (await fetch('./data/news_general.json?_=' + Date.now())).json();
  }catch(e){
    document.getElementById('list').innerHTML = '<p class="empty-state">Todavía no hay datos generales guardados. Esperá a la primera corrida del workflow.</p>';
    return;
  }
  render();
}

function render(){
  const now = Date.now();
  const cutoff = now - hoursWindow * 3600 * 1000;
  const items = allNews.filter(n=>{
    if(category && n.category !== category) return false;
    const t = new Date(n.collected_at).getTime();
    return isNaN(t) ? true : t >= cutoff;
  });

  const noteEl = document.getElementById('window-note');
  const since = new Date(cutoff);
  noteEl.textContent = hoursWindow >= 9999
    ? `Mostrando todo lo guardado (${items.length} notas)`
    : `Desde ${since.toLocaleString('es-AR')} — ${items.length} notas`;

  const listEl = document.getElementById('list');
  if(!items.length){
    listEl.innerHTML = '<p class="empty-state">No hay noticias en esa ventana de tiempo. Probá ampliarla.</p>';
    return;
  }

  // Agrupamos por día para que se lea como un resumen, no una lista plana
  const byDay = {};
  items.forEach(n=>{
    const d = new Date(n.published || n.collected_at);
    const key = isNaN(d) ? 'Fecha desconocida' : d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    (byDay[key] = byDay[key] || []).push(n);
  });

  listEl.innerHTML = Object.entries(byDay).map(([day, group])=>{
    const rows = group.map(n=>{
      const d = new Date(n.published || n.collected_at);
      const time = isNaN(d) ? '' : d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      const starMeta = { id: n.id, type: 'noticia_general', title: n.title, link: n.link, source: n.source, date: n.published };
      return `<article class="item">
        <div class="item-meta">
          <span class="cat-tag ${n.category}">${n.category}</span>
          <span>${escapeHtml(n.source || '')}</span>
          <span>· ${time}</span>
          ${window.RadarDestacados.starButtonHtml(starMeta)}
        </div>
        <p class="item-title"><a href="${n.link}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a></p>
      </article>`;
    }).join('');
    return `<div class="day-divider">${day}</div>${rows}`;
  }).join('');
}

document.querySelectorAll('.controls button[data-hours]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.controls button[data-hours]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    hoursWindow = Number(btn.dataset.hours);
    render();
  });
});
document.getElementById('filter-category').addEventListener('change', e=>{
  category = e.target.value;
  render();
});

load();
</script>
</body>
</html>
