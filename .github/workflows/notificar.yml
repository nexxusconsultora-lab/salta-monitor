name: Notificar el resumen diario al celular

# Manda el resumen del día anterior (política + seguridad) SOLO a tu celular.
# Los datos de entrega (tema de ntfy o bot de Telegram) viven en «Secrets» de GitHub: no están en el repo.
# Ver GUIA_NOTIFICACIONES.md para configurarlo en 5 minutos.
on:
  schedule:
    # 11:40 UTC = 08:40 en Argentina (UTC-3). Para cambiar la hora, sumale 3 a la hora que quieras.
    # GitHub puede demorar unos minutos las corridas programadas: es normal.
    - cron: "40 11 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar aunque ese día ya se haya avisado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notificar-resumen
  cancel-in-progress: false

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Armar los resúmenes de ayer y de hoy
        run: python scripts/resumen_diario.py

      - name: Enviar la notificación
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          if [ "$FORZAR" = "true" ]; then
            python scripts/notificar.py --forzar
          else
            python scripts/notificar.py
          fi

      - name: Guardar el registro de avisos
        if: always()
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add -A data/resumenes || true
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Registro de avisos y resumen diario"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
