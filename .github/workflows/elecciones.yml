name: Resultados electorales

on:
  schedule:
    # Cada 5 minutos entre las 21:00 y las 02:55 de Argentina (00:00 a 05:55 UTC): la franja de las noches de elecciones.
    # Si ese día no hay elecciones, el script termina en segundos sin tocar nada.
    - cron: "*/5 0-5 * * *"
    # Dos controles diarios para el escrutinio definitivo de los días siguientes (09:00 y 15:00 de Argentina).
    - cron: "0 12,18 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "probar_dine = consulta la API oficial con la elección de 2023; diagnosticar = mira cómo entregan los datos los sitios oficiales; recolectar = corre como en una elección"
        type: choice
        default: probar_dine
        options:
          - probar_dine
          - diagnosticar
          - recolectar

permissions:
  contents: write

concurrency:
  group: elecciones-newar
  cancel-in-progress: false

jobs:
  elecciones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Correr el recolector (o el diagnóstico)
        env:
          MODO: ${{ inputs.modo }}
          DINE_TOKEN: ${{ secrets.DINE_TOKEN }}
        run: |
          if [ "$MODO" = "probar_dine" ]; then
            python scripts/elecciones.py --probar-dine
          elif [ "$MODO" = "diagnosticar" ]; then
            python scripts/elecciones.py --diagnosticar
          else
            python scripts/elecciones.py
          fi

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add -- 'data/elecciones_resultados*.json'
          git add -- data/elecciones_diagnostico.json 2>/dev/null || true
          git add -- data/elecciones_diagnostico_dine.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de resultados electorales"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
