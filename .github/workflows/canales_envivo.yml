name: Completar canales en vivo

on:
  # Corre solo cuando se sube este script o este archivo (así la primera vez no hay que hacer nada más),
  # una vez por semana, y cuando lo pedís a mano (pestaña Actions > Run workflow).
  # No incluye data/canales_envivo.json a propósito: así el guardado de datos
  # no vuelve a disparar este workflow en bucle.
  push:
    branches: [main]
    paths:
      - "scripts/canales_en_vivo.py"
      - ".github/workflows/canales_envivo.yml"
  schedule:
    - cron: "30 6 * * 1"   # lunes 06:30 (hora de GitHub = UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: canales-envivo
  cancel-in-progress: false

jobs:
  canales:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Leer de YouTube los códigos que faltan
        run: python scripts/canales_en_vivo.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/canales_envivo.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de canales en vivo"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
