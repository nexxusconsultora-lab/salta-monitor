name: Auditoría de seguridad

# Revisa en cada cambio (y cada lunes) que no haya secretos en el código, que la página siga bien protegida,
# que los datos no escondan código y que los workflows estén blindados. No usa claves ni red.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request: {}
  schedule:
    - cron: "20 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auditoria-seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Compilar los scripts de Python
        run: python -m py_compile scripts/*.py

      - name: Revisar la sintaxis de los scripts de index.html
        run: |
          python - <<'PY'
          import re
          t = open("index.html", encoding="utf-8").read()
          for i, m in enumerate(re.finditer(r"<script>(.*?)</script>", t, re.S)):
              open(f"/tmp/script{i}.js", "w", encoding="utf-8").write(m.group(1))
          PY
          for f in /tmp/script*.js; do node --check "$f"; done

      - name: Auditoría de seguridad
        run: python scripts/auditoria_seguridad.py
