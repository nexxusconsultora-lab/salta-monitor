name: Prensa internacional

on:
  # Corre cuando se sube o cambia el script (así la pestaña «Mundo» tiene datos sin esperar).
  # No incluye data/news_internacional.json a propósito: así el commit de datos no dispara otra corrida.
  push:
    branches: [main]
    paths:
      - "scripts/internacional.py"
      - ".github/workflows/internacional.yml"
  schedule:
    # Cada hora (hora UTC de GitHub; no es exacto cuando hay mucha carga).
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: internacional-newar
  cancel-in-progress: false

jobs:
  internacional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Instalar lector de RSS
        run: pip install feedparser

      - name: Leer los diarios internacionales
        run: python scripts/internacional.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "radar-politico-bot@users.noreply.github.com"
          git add data/news_internacional.json data/internacional_status.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de prensa internacional"
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Reintentando ($intento/3)..."
            git rebase --abort || true
            sleep 5
          done
          echo "No se pudo guardar tras 3 intentos."
          exit 1
